<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CRH 3D 火箭动车组 · WebGL 真实世界</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#000;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none;
  }
  #cv{display:block;width:100%;height:100%;touch-action:none;}
  #ui{position:fixed;inset:0;pointer-events:none;}

  .panel{
    position:absolute;
    background:rgba(8,14,24,.74);
    border:1px solid rgba(120,180,255,.22);
    border-radius:14px;
    padding:12px 16px;
    color:#cfe4ff;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    box-shadow:0 6px 24px rgba(0,0,0,.45);
  }

  /* 速度表 */
  #speedPanel{right:16px;top:16px;text-align:right;min-width:190px;}
  #speedVal{font-size:clamp(44px,9vw,68px);font-weight:700;line-height:.95;
    font-variant-numeric:tabular-nums;letter-spacing:-2px;
    color:#eaf6ff;text-shadow:0 0 24px rgba(80,180,255,.55);
    transition:color .2s,text-shadow .2s;}
  #speedVal.free{color:#ffcf5c;text-shadow:0 0 28px rgba(255,180,40,.75);}
  #speedUnit{font-size:12px;letter-spacing:4px;color:#7fa8cc;margin-top:2px;}
  #limitRow{margin-top:6px;font-size:12px;color:#8fb6d8;}
  #limitRow b{color:#7ee2a8;font-size:14px;}
  #limitRow b.off{color:#ff8a5c;}

  /* 左侧信息 + ATP */
  #leftPanel{left:16px;top:16px;min-width:230px;}
  .row{display:flex;justify-content:space-between;align-items:center;
    font-size:13px;margin-bottom:7px;gap:10px;}
  .row:last-child{margin-bottom:0;}
  .k{color:#7fa8cc;}
  .v{font-weight:600;font-variant-numeric:tabular-nums;}
  #notchVal.pull{color:#7ee2a8;}
  #notchVal.coast{color:#9fb6cc;}
  #notchVal.brake{color:#ff7a6b;}

  #notchBar{position:relative;height:9px;border-radius:5px;
    background:linear-gradient(90deg,rgba(255,90,70,.35) 0%,rgba(255,90,70,.35) 44.4%,
    rgba(150,170,190,.35) 44.4%,rgba(150,170,190,.35) 55.6%,
    rgba(80,220,150,.3) 55.6%,rgba(80,220,150,.3) 100%);
    margin:8px 0 10px;}
  #notchMark{position:absolute;top:-4px;width:4px;height:17px;border-radius:2px;
    background:#fff;box-shadow:0 0 10px rgba(255,255,255,.9);
    transform:translateX(-2px);transition:background .15s;}

  #atpRow{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  #atpState{font-size:13px;font-weight:700;color:#7ee2a8;}
  #atpState.off{color:#ff7a6b;}
  #atpBtn{
    pointer-events:auto;cursor:pointer;
    background:rgba(255,90,70,.16);
    border:1px solid rgba(255,110,80,.55);
    color:#ffb0a0;
    padding:9px 16px;border-radius:10px;
    font-size:13px;font-weight:700;font-family:inherit;
    transition:all .15s;touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  #atpBtn.on{background:rgba(80,220,150,.16);border-color:rgba(80,220,150,.55);color:#9df3c4;}

  /* 提示 */
  #hint{position:absolute;top:18px;left:50%;transform:translateX(-50%);
    font-size:12px;color:rgba(200,225,255,.6);letter-spacing:.5px;
    text-align:center;line-height:1.6;max-width:46vw;}

  /* 触控按钮 */
  #touch{
    position:fixed;left:0;right:0;bottom:0;
    display:flex;gap:12px;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));
    pointer-events:none;z-index:20;
  }
  .tbtn{
    pointer-events:auto;flex:1;min-height:80px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;border-radius:18px;
    border:1px solid rgba(140,190,255,.32);
    background:rgba(18,28,46,.8);color:#cfe4ff;
    font-size:17px;font-weight:700;font-family:inherit;
    letter-spacing:3px;backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    box-shadow:0 6px 20px rgba(0,0,0,.45);
    touch-action:none;-webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
    transition:transform .07s,background .07s,border-color .07s;
  }
  .tbtn small{font-size:10px;letter-spacing:1px;color:#7fa8cc;font-weight:500;}
  .tbtn.act{transform:scale(.965);}
  #btnPull.act{background:rgba(50,170,105,.5);border-color:rgba(100,235,160,.8);color:#e6fff1;}
  #btnBrake.act{background:rgba(195,65,50,.5);border-color:rgba(255,125,105,.8);color:#fff0ec;}
  #btnCoast.act{background:rgba(90,120,160,.5);border-color:rgba(170,200,240,.7);}

  /* 超速报警 */
  #warn{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);
    font-size:clamp(26px,7vw,46px);font-weight:800;color:#ff5b4a;letter-spacing:8px;
    text-shadow:0 0 30px rgba(255,60,40,.9);opacity:0;pointer-events:none;white-space:nowrap;}
</style>
</head>
<body>
<div id="cv"></div>

<div id="ui">
  <div id="hint">按住下方按钮牵引 / 制动 · 点击 ATP 按钮解除防护</div>
  <div id="warn">超 速 报 警</div>

  <div class="panel" id="leftPanel">
    <div class="row">
      <span class="k">司控器</span>
      <span class="v" id="notchVal">惰行</span>
    </div>
    <div id="notchBar"><div id="notchMark" style="left:44.4%"></div></div>
    <div class="row" id="atpRow">
      <span id="atpState">ATP 防护：启用</span>
      <button id="atpBtn">解除 ATP</button>
    </div>
  </div>

  <div class="panel" id="speedPanel">
    <div id="speedVal">0</div>
    <div id="speedUnit">km/h</div>
    <div id="limitRow">限速 <b id="limitVal">300</b> km/h</div>
  </div>
</div>

<div id="touch">
  <button class="tbtn" id="btnBrake">制 动<small>按住</small></button>
  <button class="tbtn" id="btnCoast">惰 行<small>点击</small></button>
  <button class="tbtn" id="btnPull">牵 引<small>按住</small></button>
</div>

<!-- 引入 Three.js 3D 引擎 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* =======================================================
   常量  —— 火箭级动力，真 3D 世界
   ======================================================= */
const MASS         = 500000;
const MAX_TRACTION = 1.0e6;
const POWER        = 50e6;
const BRAKE_DECEL  = 1.60;
const EMERG_DECEL  = 2.00;
const A_RES = 2600, B_RES = 45, C_RES = 8.2;
const ATP_LIMIT_KMH = 300;

const NOTCH_MAX  =  100;
const NOTCH_MIN  =  -80;
const NOTCH_RATE =   90;

/* =======================================================
   Three.js 核心初始化
   ======================================================= */
const container = document.getElementById('cv');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB); // 天空蓝
scene.fog = new THREE.FogExp2(0x87CEEB, 0.0008); // 雾效，增加深度感

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 20000);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// 光照
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(100, 200, 50);
scene.add(dirLight);

/* =======================================================
   生成 3D 轨道
   ======================================================= */
const trackLength = 20000; // 轨道总长
const trackPoints = [];
const numPoints = 200;

for (let i = 0; i < numPoints; i++) {
    const t = i / (numPoints - 1);
    const z = -t * trackLength; // 向 -Z 延伸
    // 随机生成横向 X 偏移（弯道）
    const x = Math.sin(t * Math.PI * 8) * 150 + Math.sin(t * Math.PI * 23) * 30;
    // 随机生成纵向 Y 偏移（上下坡）
    const y = Math.sin(t * Math.PI * 6) * 40 + Math.cos(t * Math.PI * 15) * 10;
    trackPoints.push(new THREE.Vector3(x, y, z));
}

// 创建平滑 3D 曲线
const curve = new THREE.CatmullRomCurve3(trackPoints);

// 绘制道砟（用粗圆柱体模拟路基）
const ballastGeo = new THREE.TubeGeometry(curve, 800, 4.5, 8, false);
const ballastMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 1 });
const ballast = new THREE.Mesh(ballastGeo, ballastMat);
scene.add(ballast);

// 绘制钢轨（两根细管，沿曲线偏移）
// Three.js 原生没有直接偏移曲线的功能，我们通过数学手动计算平行曲线
const railOffset = 2.0;
const railPointsL = [];
const railPointsR = [];

for (let i = 0; i <= 800; i++) {
    const t = i / 800;
    const point = curve.getPointAt(t);
    const tangent = curve.getTangentAt(t);
    // 计算法线（指向右侧）
    const up = new THREE.Vector3(0, 1, 0);
    const right = new THREE.Vector3().crossVectors(tangent, up).normalize();
    
    railPointsL.push(point.clone().add(right.clone().multiplyScalar(-railOffset)));
    railPointsR.push(point.clone().add(right.clone().multiplyScalar(railOffset)));
}

const railCurveL = new THREE.CatmullRomCurve3(railPointsL);
const railCurveR = new THREE.CatmullRomCurve3(railPointsR);

const railGeo = new THREE.TubeGeometry(railCurveL, 800, 0.15, 4, false);
const railMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.8, roughness: 0.2 });
scene.add(new THREE.Mesh(railGeo, railMat));
scene.add(new THREE.Mesh(new THREE.TubeGeometry(railCurveR, 800, 0.15, 4, false), railMat));

/* =======================================================
   接触网支柱
   ======================================================= */
const poleMat = new THREE.MeshStandardMaterial({ color: 0x666666 });
const wireMat = new THREE.LineBasicMaterial({ color: 0x333333 });

const wirePoints = [];

for (let i = 0; i < 80; i++) {
    const t = i / 79;
    const p = curve.getPointAt(t);
    const tangent = curve.getTangentAt(t);
    const up = new THREE.Vector3(0, 1, 0);
    const right = new THREE.Vector3().crossVectors(tangent, up).normalize();

    // 支柱
    const poleGeo = new THREE.CylinderGeometry(0.2, 0.3, 12, 6);
    const pole = new THREE.Mesh(poleGeo, poleMat);
    pole.position.copy(p).add(right.clone().multiplyScalar(7));
    pole.position.y += 6;
    scene.add(pole);

    // 横梁
    const beamGeo = new THREE.BoxGeometry(14, 0.4, 0.4);
    const beam = new THREE.Mesh(beamGeo, poleMat);
    beam.position.copy(p).add(right.clone().multiplyScalar(0));
    beam.position.y += 12;
    beam.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0), right);
    scene.add(beam);

    // 接触线悬挂点
    wirePoints.push(p.clone().add(new THREE.Vector3(0, 11, 0)));
}

// 接触线
const wireGeo = new THREE.BufferGeometry().setFromPoints(wirePoints);
const wireLine = new THREE.Line(wireGeo, wireMat);
scene.add(wireLine);

/* =======================================================
   火车模型（简单的 3D 几何体组合）
   ======================================================= */
const trainGroup = new THREE.Group();

// 车体
const bodyGeo = new THREE.CylinderGeometry(2.2, 2.2, 28, 16);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, metalness: 0.6, roughness: 0.3 });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.rotation.x = Math.PI / 2;
body.position.z = 14;
trainGroup.add(body);

// 车头（圆锥）
const noseGeo = new THREE.ConeGeometry(2.2, 6, 16);
const noseMat = new THREE.MeshStandardMaterial({ color: 0xff2222, metalness: 0.8, roughness: 0.2 });
const nose = new THREE.Mesh(noseGeo, noseMat);
nose.rotation.x = -Math.PI / 2;
nose.position.z = 0;
trainGroup.add(nose);

// 车窗（简单的黑色盒子）
const windowGeo = new THREE.BoxGeometry(4.4, 1.2, 0.2);
const windowMat = new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.9, roughness: 0.1 });
for (let i = 0; i < 5; i++) {
    const win = new THREE.Mesh(windowGeo, windowMat);
    win.position.set(0, 0.8, 6 + i * 5);
    trainGroup.add(win);
}

scene.add(trainGroup);

/* =======================================================
   游戏状态
   ======================================================= */
const S = {
  v: 0,
  pos: 0,
  notch: 0,
  atpOn: true,
  atpBrake: false,
  warn: false,
  time: 0,
  t: 0 // 曲线参数 0~1
};

const kb = { pull:false, brake:false };
const tc = { pull:false, brake:false };

/* =======================================================
   键盘与触屏事件
   ======================================================= */
window.addEventListener('keydown', e => {
  if(['ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  switch(e.code){
    case 'KeyW': case 'ArrowUp':   kb.pull  = true; break;
    case 'KeyS': case 'ArrowDown': kb.brake = true; break;
    case 'Space': if(!e.repeat) S.notch = 0; break;
    case 'KeyD':  if(!e.repeat) toggleATP(); break;
  }
}, {passive:false});

window.addEventListener('keyup', e => {
  switch(e.code){
    case 'KeyW': case 'ArrowUp':   kb.pull  = false; break;
    case 'KeyS': case 'ArrowDown': kb.brake = false; break;
  }
});

function toggleATP(){
  S.atpOn = !S.atpOn;
  if(!S.atpOn) S.atpBrake = false;
  const btn = document.getElementById('atpBtn');
  const st  = document.getElementById('atpState');
  if(S.atpOn){
    btn.textContent = '解除 ATP'; btn.classList.remove('on');
    st.textContent = 'ATP 防护：启用'; st.classList.remove('off');
  }else{
    btn.textContent = '恢复 ATP'; btn.classList.add('on');
    st.textContent = 'ATP 防护：已解除'; st.classList.add('off');
  }
  document.getElementById('speedVal').classList.toggle('free', !S.atpOn);
  const lim = document.getElementById('limitVal');
  lim.classList.toggle('off', !S.atpOn);
  lim.textContent = S.atpOn ? '300' : '∞';
}

document.getElementById('atpBtn').addEventListener('click', e => { e.preventDefault(); toggleATP(); e.currentTarget.blur(); });

function bindHold(el, onDown, onUp){
  let active = false;
  const down = e => { e.preventDefault(); active = true; el.classList.add('act'); try{ el.setPointerCapture(e.pointerId); }catch(_){} onDown(); };
  const up = () => { if(!active) return; active = false; el.classList.remove('act'); onUp(); };
  el.addEventListener('pointerdown', down, {passive:false});
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('lostpointercapture', up);
  el.addEventListener('contextmenu', e => e.preventDefault());
}

bindHold(document.getElementById('btnPull'),  () => tc.pull  = true, () => tc.pull  = false);
bindHold(document.getElementById('btnBrake'), () => tc.brake = true, () => tc.brake = false);

const btnCoast = document.getElementById('btnCoast');
btnCoast.addEventListener('pointerdown', e => { e.preventDefault(); btnCoast.classList.add('act'); S.notch = 0; });
['pointerup','pointercancel','pointerleave'].forEach(ev => btnCoast.addEventListener(ev, () => btnCoast.classList.remove('act')));
btnCoast.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});

/* =======================================================
   物理更新与 3D 动画
   ======================================================= */
function update(dt){
  S.time += dt;

  const pull  = kb.pull  || tc.pull;
  const brake = kb.brake || tc.brake;

  if(pull)  S.notch = Math.min(NOTCH_MAX, S.notch + NOTCH_RATE * dt);
  if(brake) S.notch = Math.max(NOTCH_MIN, S.notch - NOTCH_RATE * dt);

  const v = S.v;
  let F = 0;
  if(S.notch > 0.5){
    const fmax = Math.min(MAX_TRACTION, POWER / Math.max(v, 5));
    F = fmax * (S.notch / NOTCH_MAX);
  }else if(S.notch < -0.5){
    F = -MASS * BRAKE_DECEL * (Math.min(-S.notch, -NOTCH_MIN) / -NOTCH_MIN);
  }
  if(S.atpBrake) F = Math.min(F, -MASS * EMERG_DECEL);

  const drag = A_RES + B_RES * v + C_RES * v * v;
  const a = (F - (v > 0.05 ? drag : 0)) / MASS;

  S.v = Math.max(0, v + a * dt);
  S.pos += S.v * dt;

  if(S.atpOn){
    const limit = ATP_LIMIT_KMH / 3.6;
    if(!S.atpBrake){ if(S.v > limit + 0.9) S.atpBrake = true; }
    else{ if(S.v < limit - 0.9) S.atpBrake = false; }
    S.warn = S.v > limit;
  }else{ S.atpBrake = false; S.warn = false; }

  // 更新曲线进度 t
  S.t += (S.v * dt) / trackLength;
  if (S.t > 1) S.t -= 1; // 循环

  /* --- 3D 模型位置与旋转更新 --- */
  const trainPos = curve.getPointAt(S.t);
  const trainTangent = curve.getTangentAt(S.t);
  
  // 列车的 Z 轴朝向切线方向
  trainGroup.position.copy(trainPos);
  const lookAtPoint = trainPos.clone().add(trainTangent);
  trainGroup.lookAt(lookAtPoint);
  
  // 因为车体本身建模是沿着 Z 轴的，所以 lookAt 刚好对齐
  // 但我们的车头是 -Z 方向，所以加个 180 度旋转
  trainGroup.rotateY(Math.PI);

  /* --- 相机跟随（第三人称） --- */
  // 相机放在列车后上方
  const camOffset = new THREE.Vector3(0, 8, 20);
  camOffset.applyQuaternion(trainGroup.quaternion);
  const idealCamPos = trainPos.clone().add(camOffset);
  
  // 平滑跟随
  camera.position.lerp(idealCamPos, 0.1);
  camera.lookAt(trainPos.clone().add(trainTangent.clone().multiplyScalar(15))); // 看向前方

  // 速度感：动态 FOV
  const baseFov = 75;
  const targetFov = baseFov + (S.v * 3.6) * 0.04; // 速度越快，视野越广
  camera.fov += (Math.min(targetFov, 130) - camera.fov) * 0.1;
  camera.updateProjectionMatrix();
}

/* =======================================================
   HUD 更新
   ======================================================= */
const spdEl   = document.getElementById('speedVal');
const notchEl = document.getElementById('notchVal');
const markEl  = document.getElementById('notchMark');
const warnEl  = document.getElementById('warn');

function updateHUD(){
  const kmh = S.v * 3.6;
  spdEl.textContent = Math.round(kmh);

  const nt = S.notch;
  let cls, txt;
  if(nt > 1){ cls = 'pull';  txt = '牵引 ' + Math.round(nt); }
  else if(nt < -1){ cls = 'brake'; txt = '制动 ' + Math.round(-nt); }
  else { cls = 'coast'; txt = '惰行'; }
  notchEl.className = cls;
  notchEl.textContent = txt;

  const pct = (nt - NOTCH_MIN) / (NOTCH_MAX - NOTCH_MIN) * 100;
  markEl.style.left = pct + '%';
  markEl.style.background = cls === 'brake' ? '#ff7a6b' : cls === 'pull' ? '#7ee2a8' : '#dfe9f2';

  if(S.warn && S.atpOn){ warnEl.style.opacity = 0.55 + 0.45 * Math.sin(S.time * 16); }
  else{ warnEl.style.opacity = 0; }
}

/* =======================================================
   主循环
   ======================================================= */
let lastT = 0;
function frame(t){
  if(!lastT) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  if(dt > 0.05) dt = 0.05;

  update(dt);
  renderer.render(scene, camera);
  updateHUD();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* 窗口大小调整 */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
