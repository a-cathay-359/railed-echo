<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Railed Echo · 真实地理版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%23e8352c'/%3E%3Cpath d='M5 12h14M9 5l1.5 7M15 5l-1.5 7' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">

<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root {
  --red: #e8352c; --amber: #ffb020; --green: #2fb24f;
  --panel: rgba(10, 18, 28, .6); --line: rgba(255, 255, 255, .14);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; overflow: hidden; background: #0c1520; color: #eaf2fa;
  font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  -webkit-user-select: none; user-select: none; overscroll-behavior: none; touch-action: none;
}

#game { position: fixed; inset: 0; display: block; touch-action: none; }
#nightOv {
  position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 45%, rgba(10,15,40,.1), rgba(4,6,20,.85));
  opacity: 0; transition: opacity 2s;
}

#wrap { position: fixed; inset: 0; pointer-events: none; }
.pill {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}

/* HUD Top */
#hudTop {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top));
  display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
}
#speedBox { min-width: 112px; padding: 9px 13px; text-align: center; }
#speedVal { font-size: 32px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
#speedVal b { font-size: 14px; font-weight: 600; color: #9fb2c6; margin-left: 2px; }
#speedLbl { font-size: 11px; color: #9fb2c6; margin-top: 2px; letter-spacing: 2px; }
#limitTag { margin-top: 6px; padding: 3px 8px; font-size: 12px; font-weight: 700; border-radius: 6px; display: inline-block; }
#limitTag.ok { background: rgba(47,178,79,.16); color: #6fe08b; }
#limitTag.over { background: rgba(232,53,44,.2); color: #ff8d85; animation: blink .5s infinite; }

#rightCol { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
#rowTop { display: flex; gap: 8px; align-items: center; }
.iconBtn {
  pointer-events: auto; width: 42px; height: 42px; border-radius: 11px;
  border: 1px solid var(--line); background: var(--panel); color: #eaf2fa;
  font-size: 14px; font-weight: 800; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.iconBtn:active { background: rgba(255,255,255,.22); }

.time-ctrl {
  display: flex; align-items: center; border-radius: 11px; border: 1px solid var(--line);
  background: var(--panel); backdrop-filter: blur(8px); pointer-events: auto;
}
.time-ctrl button {
  background: transparent; border: none; color: #fff; width: 34px; height: 40px;
  font-size: 20px; font-weight: bold; cursor: pointer;
}
.time-ctrl button:active { background: rgba(255,255,255,.2); }
.time-ctrl span { width: 54px; text-align: center; font-size: 14px; font-weight: 800; color: #ffc85c; }

.stat { padding: 7px 11px; font-size: 13px; line-height: 1.5; }
.stat .k { color: #9fb2c6; font-size: 11px; }
.stat .v { font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .v.good { color: #6fe08b; } .stat .v.warn { color: #ffc85c; } .stat .v.bad { color: #ff8d85; }

#prog { margin-top: 6px; width: 140px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
#prog > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #2fb24f, #e8352c); transition: width .2s; }
#sigDot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: middle; }
#sigDot.g { background: #2fb24f; box-shadow: 0 0 8px #2fb24f; }
#sigDot.y { background: #ffb020; box-shadow: 0 0 8px #ffb020; }
#sigDot.r { background: #ff3b30; box-shadow: 0 0 10px #ff3b30; }
#sigDot.o { background: #6c7a8c; }

#centerTop { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
#msg { display: none; padding: 8px 16px; font-size: 14px; font-weight: 700; border-radius: 10px; white-space: nowrap; }
#msg.on { display: inline-block; }
#msg.good { background: rgba(16,90,50,.88); color: #a7f3c4; }
#msg.warn { background: rgba(120,70,0,.88); color: #ffe0a3; }
#msg.bad  { background: rgba(130,18,18,.92); color: #ffc4c0; }

/* Levers */
.lever { position: absolute; top: 150px; width: 52px; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
#throttleLever { right: 10px; top: calc(140px + env(safe-area-inset-top)); }
#brakeLever { left: 10px; top: calc(140px + env(safe-area-inset-top)); }
.lever .cap { font-size: 11px; font-weight: 700; color: #9fb2c6; text-align: center; margin-bottom: 6px; letter-spacing: 2px; }
.lever .track {
  position: relative; height: 240px; background: rgba(8,14,22,.6);
  border: 1px solid var(--line); border-radius: 14px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.lever .tick { position: absolute; left: 8px; right: 8px; height: 1px; background: rgba(255,255,255,.16); pointer-events: none; }
.lever .ticklbl { position: absolute; width: 38px; font-size: 10px; color: #b6c2d0; line-height: 1; text-align: center; pointer-events: none; }
.lever .handle {
  position: absolute; left: 5px; right: 5px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800; box-shadow: 0 2px 10px rgba(0,0,0,.5);
  transition: bottom .08s; pointer-events: none;
}
#throttleLever .handle { background: linear-gradient(180deg, #37c264, #1f8f42); color: #eafff0; }
#brakeLever .handle { background: linear-gradient(180deg, #f0a020, #c96a10); color: #fff; }
#brakeLever .handle.emer { background: linear-gradient(180deg, #ff5040, #b81f14); }

/* Bottom HUD */
#hudBot {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 8px 12px; padding-bottom: calc(8px + env(safe-area-inset-bottom));
  display: flex; justify-content: center; align-items: flex-end; gap: 12px;
}
#midInfo { padding: 8px 14px; font-size: 12px; line-height: 1.6; }
#midInfo .big { font-size: 20px; font-weight: 800; }
.hornBtn {
  pointer-events: auto; width: 64px; height: 64px; border-radius: 50%;
  border: 1px solid rgba(232,53,44,.6); background: rgba(232,53,44,.3);
  color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.hornBtn:active { transform: scale(.94); background: rgba(232,53,44,.5); }

#alignWrap { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); padding: 6px; display: none; pointer-events: none; z-index: 5; border-radius: 12px; }
#alignCv { display: block; border-radius: 10px; }

/* Map Modal */
#mapModal {
  position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  display: none; opacity: 0; transition: opacity 0.3s;
  align-items: center; justify-content: center; padding: 20px;
}
#mapModal.on { display: flex; opacity: 1; }
#mapContainer {
  width: 100%; max-width: 900px; height: 100%; max-height: 80vh;
  background: #111; border-radius: 16px; border: 1px solid var(--line);
  box-shadow: 0 20px 60px rgba(0,0,0,0.8); position: relative; overflow: hidden;
  pointer-events: auto;
}
#leafletMap { width: 100%; height: 100%; z-index: 1; }
#closeMapBtn {
  position: absolute; top: 12px; right: 12px; z-index: 1000;
  background: rgba(0,0,0,0.7); color: #fff; border: 1px solid rgba(255,255,255,0.3);
  width: 36px; height: 36px; border-radius: 8px; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

/* Menus */
.overlay { position: fixed; inset: 0; padding: 16px; z-index: 60; display: flex; align-items: center; justify-content: center; overflow: auto; background: radial-gradient(120% 120% at 50% 0%, rgba(16,28,42,.94), rgba(5,9,16,.98)); }
.overlay.hide { display: none; }
.card { max-width: 460px; width: 100%; padding: 22px; background: rgba(12,20,32,.94); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.title { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.title .tag { padding: 3px 8px; font-size: 11px; font-weight: 600; background: var(--red); color: #fff; border-radius: 6px; }
.sub { margin-top: 6px; font-size: 13px; color: #9fb2c6; }
.routeList { margin: 14px 0; display: flex; flex-direction: column; gap: 8px; }
.routeCard { padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.04); cursor: pointer; }
.routeCard:active { background: rgba(255,255,255,.09); }
.routeCard.sel { border-color: var(--green); background: rgba(47,178,79,.14); }
.routeCard .rn { font-size: 16px; font-weight: 800; }
.routeCard .rd { margin-top: 3px; font-size: 12px; color: #9fb2c6; line-height: 1.5; }
.routeCard .rk { display: inline-block; margin-top: 5px; margin-right: 5px; padding: 2px 7px; font-size: 11px; background: rgba(255,255,255,.1); border-radius: 5px; }
.go { width: 100%; margin-top: 8px; padding: 14px; font-size: 17px; font-weight: 800; letter-spacing: 4px; background: var(--red); color: #fff; border: none; border-radius: 12px; cursor: pointer; }
.go:active { transform: translateY(1px); background: #c92c24; }
.hint { margin-top: 12px; font-size: 11px; color: #6c7a8c; text-align: center; line-height: 1.6; }

.result-line { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed rgba(255,255,255,.1); font-size: 14px; }
.result-line:last-child { border: none; }
.result-line .l { color: #9fb2c6; } .result-line .r { font-weight: 800; font-variant-numeric: tabular-nums; }
#gradeBig { margin: 6px 0 2px; font-size: 60px; font-weight: 900; line-height: 1; text-align: center; }
#gradeSub { margin-bottom: 12px; font-size: 13px; color: #9fb2c6; text-align: center; }
#crashReason { margin-bottom: 10px; font-size: 14px; font-weight: 700; color: #ff8d85; text-align: center; }
@keyframes blink { 50% { opacity: .45; } }

@media (max-width: 600px) {
  #speedVal { font-size: 26px; } .stat { font-size: 12px; padding: 6px 9px; } #prog { width: 100px; }
  .lever { top: 130px; width: 48px; } .lever .track { height: 190px; } #alignCv { width: 320px; height: 88px; }
}
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="nightOv"></div>

<div id="wrap">
  <div id="hudTop">
    <div id="speedBox" class="pill">
      <div id="speedVal">0<b>km/h</b></div>
      <div id="speedLbl">当前速度</div>
      <span id="limitTag" class="ok">限速 350</span>
    </div>
    <div id="rightCol">
      <div id="rowTop">
        <div class="pill stat">
          <span class="k">行程 </span><span id="progTxt" class="v">0%</span>
          <div id="prog"><i></i></div>
        </div>
        <button class="iconBtn" id="mapBtn" title="线路地图">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
        </button>
        <button class="iconBtn" id="pauseBtn" title="暂停/继续">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
        <button class="iconBtn" id="camBtn" title="切换视角">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <div class="time-ctrl">
          <button id="timeMinus">−</button>
          <span id="timeBtn">1x</span>
          <button id="timePlus">+</button>
        </div>
        <button class="iconBtn" id="muteBtn" title="声音开关">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><line id="muteline1" x1="22" y1="9"  x2="16" y2="15"/><line id="muteline2" x1="16" y1="9"  x2="22" y2="15"/></svg>
        </button>
      </div>
      <div class="pill stat"><span class="k">时刻 </span><span id="timeTxt" class="v">00:00</span></div>
      <div class="pill stat"><span class="k">准点 </span><span id="puncTxt" class="v good">±0s</span></div>
    </div>
  </div>

  <div id="centerTop"><div id="msg"></div></div>

  <div class="lever" id="brakeLever"><div class="cap">制动</div><div class="track" id="brakeTrack"></div></div>
  <div class="lever" id="throttleLever"><div class="cap">牵引</div><div class="track" id="throttleTrack"></div></div>

  <div id="hudBot">
    <div id="midInfo" class="pill">
      <div><span class="k">下一信号 </span><span id="sigDot" class="o"></span> <span id="sigTxt">--</span></div>
      <div><span class="k">牵引 </span><span id="thrVal">0</span> 档 · <span class="k">制动 </span><span id="brkVal">缓解</span></div>
      <div><span class="k">下一站 </span><span id="stopDist" class="big">--</span></div>
      <div><span class="k">评分 </span><span id="scoreTxt" class="v warn">100</span></div>
    </div>
    <button class="hornBtn" id="btnHorn">鸣笛</button>
  </div>

  <div id="alignWrap" class="pill">
    <canvas id="alignCv" width="1120" height="296" style="width:560px;height:148px;"></canvas>
  </div>
</div>

<!-- 悬浮地图模态框 -->
<div id="mapModal">
  <div id="mapContainer">
    <div id="leafletMap"></div>
    <button id="closeMapBtn">×</button>
  </div>
</div>

<div class="overlay" id="startOv">
  <div class="card">
    <div class="title">Railed Echo<span class="tag">真实地理版</span></div>
    <div class="sub">接驳真实经纬度 · 支持高倍速物理演算</div>
    <div class="routeList" id="routeList"></div>
    <button class="go" id="startBtn">发 车</button>
    <div class="hint">进入车站前会弹出俯视对标器，把红色停车标对准中央列车即精准停车<br>高倍速下物理引擎自动细分为微步长演算，不会穿过站点</div>
  </div>
</div>

<div class="overlay hide" id="endOv">
  <div class="card">
    <div class="title" id="endTitle">任务完成</div>
    <div id="crashReason" style="display:none"></div>
    <div id="gradeBig">S</div>
    <div id="gradeSub">全速准点 · 车长典范</div>
    <div id="endBody"></div>
    <button class="go" id="againBtn">再跑一趟</button>
  </div>
</div>

<script src="https://unpkg.com/three@0.150.0/build/three.min.js"></script>
<script>
"use strict";

/* ============================================================================
 * 1. 真实线路数据（真实里程、经纬度）
 * ============================================================================ */
const ROUTES = {
  jinghu: {
    name: '京沪高铁', sub: '北京南 → 上海虹桥',
    vmax: 350, target: 14200,
    sky: 0x9fc3e0, fog: 0xcfe0ee, ground: 0x6f8a4a,
    total: 1318000,
    zones: [{ d: 1150000, end: 1220000, limit: 200 }],
    signals: [{ d: 600000, kind: 'slow', name: '济南局界慢行', limit: 250 }],
    stations: [
      { name: '北京南',   d: 0,       half: 400, lat: 39.865, lng: 116.378, start: true },
      { name: '天津南',   d: 120000,  half: 400, lat: 39.036, lng: 117.062 },
      { name: '济南西',   d: 406000,  half: 400, lat: 36.668, lng: 116.890 },
      { name: '南京南',   d: 1023000, half: 400, lat: 31.968, lng: 118.797 },
      { name: '上海虹桥', d: 1318000, half: 500, lat: 31.196, lng: 121.320, final: true }
    ],
    tunnel: { d: 800000, end: 830000 },
    meets: [ { d: 300000 }, { d: 900000 } ]
  },
  chengyu: {
    name: '成渝高铁', sub: '成都东 → 重庆北',
    vmax: 300, target: 4500,
    sky: 0x8bb6cf, fog: 0xd6e4dc, ground: 0x4f703c,
    total: 308000,
    zones: [{ d: 200000, end: 230000, limit: 160 }],
    signals: [{ d: 100000, kind: 'slow', name: '资中慢行', limit: 200 }],
    stations: [
      { name: '成都东', d: 0,      half: 400, lat: 30.628, lng: 104.141, start: true },
      { name: '资阳北', d: 84000,  half: 400, lat: 30.121, lng: 104.632 },
      { name: '内江北', d: 153000, half: 400, lat: 29.597, lng: 105.053 },
      { name: '重庆北', d: 308000, half: 500, lat: 29.608, lng: 106.551, final: true }
    ],
    tunnel: { d: 50000, end: 80000 },
    meets: [ { d: 120000 } ]
  },
  guangshen: {
    name: '广深城际', sub: '广州东 → 深圳北',
    vmax: 200, target: 2800,
    sky: 0xa8c8e2, fog: 0xe4eef2, ground: 0x8a9a7c,
    total: 139000,
    zones: [{ d: 60000, end: 80000, limit: 140 }],
    signals: [{ d: 40000, kind: 'slow', name: '石龙慢行', limit: 160 }],
    stations: [
      { name: '广州东', d: 0,      half: 350, lat: 23.149, lng: 113.325, start: true },
      { name: '东莞站', d: 66000,  half: 350, lat: 22.989, lng: 113.765 },
      { name: '深圳北', d: 139000, half: 400, lat: 22.610, lng: 114.029, final: true }
    ],
    tunnel: null,
    meets: [ { d: 35000 } ]
  }
};

let routeKey = 'jinghu';
let R = ROUTES[routeKey];
let zones = [], signals = [];

const G = {
  running: false, ended: false, paused: false,
  dist: 0, v: 0, time: 0, score: 100,
  throttleNotch: 0, brakeNotch: 0,
  overspeedSec: 0, atpSec: 0, atpActive: false,
  arrived: false, crashReason: '', stopBonus: 0, stopErr: null,
  stationIdx: 0, metSet: {},
  timeScale: 1, rainy: false, night: 0, camMode: 0, announced: false,
  riverD: 0, extraMeets: [], newBest: false
};
const THROT_CURVE = [0, 0.45, 0.95, 1.45, 1.95, 2.45];
const BRAKE_CURVE = [0, 0.90, 1.80, 2.90, 4.20, 7.50];
const DRAG = 0.000012;
let lastT = 0, harshCooldown = 0, msgTimer = 0;

function hash(n) { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); }
function trackX(d) { return Math.sin(d * 0.00001) * 18 + Math.sin(d * 0.000003) * 10; }
function trackDx(d) { return 18 * 0.00001 * Math.cos(d * 0.00001) + 10 * 0.000003 * Math.cos(d * 0.000003); }
function yawAt(d) { return -Math.atan(trackDx(d)); }

let actx = null, engGain = null, muted = true;
function initAudio() {
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    engGain = actx.createGain(); engGain.gain.value = 0; engGain.connect(actx.destination);
  } catch (e) { actx = null; }
}
function updateAudio() {
  if (!actx || muted || !G.running || G.paused) { if(engGain) engGain.gain.setTargetAtTime(0, actx.currentTime, 0.1); return; }
  engGain.gain.setTargetAtTime(Math.min(0.15, 0.02 + G.v * 0.0005), actx.currentTime, 0.1);
}
function horn() {
  if (!actx || muted) return;
  const t = actx.currentTime;
  [523, 659].forEach(f => {
    const o = actx.createOscillator(); o.type='sine'; o.frequency.value=f;
    const g = actx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.2,t+0.02);
    g.gain.linearRampToValueAtTime(0,t+0.8); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.9);
  });
}

/* ============================================================================
 * 2. Leaflet 地图逻辑
 * ============================================================================ */
let map = null, routeLines = [], stationMarkers = [], trainMarker = null;

function initMap() {
  if (map) return;
  map = L.map('leafletMap', { zoomControl: false }).setView([39.9, 116.4], 5);

    subdomains: ["1","2","3","4"], maxZoom: 18, attribution: '© 高德地图'
  }).addTo(map);
}

function drawMapRoute() {
  if (!map) initMap();
  routeLines.forEach(l => map.removeLayer(l));
  stationMarkers.forEach(m => map.removeLayer(m));
  if (trainMarker) map.removeLayer(trainMarker);
  routeLines = []; stationMarkers = [];

  const latlngs = [];
  R.stations.forEach(st => {
    const ll = [st.lat, st.lng]; latlngs.push(ll);
    const isFinal = st.final, color = isFinal ? '#e8352c' : '#2fb24f';
    const m = L.circleMarker(ll, { radius: 6, fillColor: color, color: '#fff', weight: 2, fillOpacity: 1 }).addTo(map).bindPopup(st.name);
    stationMarkers.push(m);
  });

  const line = L.polyline(latlngs, { color: '#e8352c', weight: 4, opacity: 0.8, dashArray: '10, 6' }).addTo(map);
  routeLines.push(line);
  map.fitBounds(line.getBounds(), { padding: [30, 30] });
  updateTrainMarker();
}

function updateTrainMarker() {
  if (!map) return;
  let p1 = R.stations[0], p2 = R.stations[1];
  for (let i = 0; i < R.stations.length - 1; i++) {
    if (G.dist >= R.stations[i].d && G.dist <= R.stations[i+1].d) { p1 = R.stations[i]; p2 = R.stations[i+1]; break; }
  }
  if (G.dist > R.total) { p1 = R.stations[R.stations.length-2]; p2 = R.stations[R.stations.length-1]; }
  const ratio = Math.max(0, Math.min(1, (G.dist - p1.d) / (p2.d - p1.d)));
  const lat = p1.lat + (p2.lat - p1.lat) * ratio, lng = p1.lng + (p2.lng - p1.lng) * ratio;
  const ll = [lat, lng];

  if (!trainMarker) {
    trainMarker = L.circleMarker(ll, { radius: 8, fillColor: '#ffd54f', color: '#000', weight: 2, fillOpacity: 1, zIndexOffset: 1000 }).addTo(map);
  } else { trainMarker.setLatLng(ll); }
}

function relX(worldD, localX) { return trackX(worldD) - trackX(G.dist) + (localX || 0); }
function relZ(worldD) { return -(worldD - G.dist); }

function updateWorld() {
  const d = G.dist, camX = trackX(d);
  const night = Math.max(0, Math.min(1, (G.time - 2000) / 1000));
  document.getElementById('nightOv').style.opacity = (night * 0.45).toFixed(3);
  ambient.intensity = 0.9 - night * 0.55;

  if (G.camMode === 0) {
    camera.position.set(0, 2, 0);
    camera.lookAt(trackX(d + 100) - camX, 1.5, -100);
    myTrain.visible = false;
  } else {
    camera.position.set(15, 10, 30);
    camera.lookAt(0, 2, 0);
    myTrain.visible = true;
  }
  myTrain.position.set(0, 0, 0);

  for (const seg of segments) {
    let wd = seg.userData.worldD;
    while (wd - d < -SEG_LEN) wd += SEG_TOTAL;
    while (wd - d > SEG_TOTAL - SEG_LEN) wd -= SEG_TOTAL;
    seg.userData.worldD = wd;
    const mid = wd + SEG_LEN / 2;
    seg.position.set(relX(mid), 0, relZ(mid));
    seg.rotation.y = yawAt(mid);
  }

  for (const m of sleepers) {
    let wd = m.userData.worldD;
    while (wd - d < -SLEEPER_STEP) wd += SLEEPER_COUNT * SLEEPER_STEP;
    while (wd - d > SLEEPER_COUNT * SLEEPER_STEP - SLEEPER_STEP) wd -= SLEEPER_COUNT * SLEEPER_STEP;
    m.userData.worldD = wd;
    m.position.set(relX(wd, m.userData.line), 0.18, relZ(wd));
    m.rotation.y = yawAt(wd);
  }

  for (const t of trees) {
    let wd = t.userData.worldD;
    while (wd - d < -TREE_STEP) wd += TREE_COUNT * TREE_STEP;
    while (wd - d > TREE_COUNT * TREE_STEP - TREE_STEP) wd -= TREE_COUNT * TREE_STEP;
    t.userData.worldD = wd;
    t.position.set(relX(wd, t.userData.side * t.userData.off), 3, relZ(wd));
  }

  for (const b of blds) {
    let wd = b.userData.worldD;
    while (wd - d < -BLD_STEP) wd += BLD_COUNT * BLD_STEP;
    while (wd - d > BLD_COUNT * BLD_STEP - BLD_STEP) wd -= BLD_COUNT * BLD_STEP;
    b.userData.worldD = wd;
    b.position.set(relX(wd, b.userData.side * b.userData.off), 7, relZ(wd));
    b.rotation.y = yawAt(wd) * 0.5;
    b.visible = b.userData.show;
  }

  ground.position.set(camX, -0.2, -(d + 2000));

  // 只有目标站存在时才显示停车标和站台
  if (G.stationIdx < R.stations.length) {
    const ns = R.stations[G.stationIdx];
    const near = d > ns.d - 1000 && d < ns.d + 500;
    stopGroup.visible = near;
    stationGrp.visible = near;
    if (near) {
      const yaw = yawAt(ns.d);
      stopGroup.position.set(relX(ns.d), 0, relZ(ns.d));
      stopGroup.rotation.y = yaw;
      const dx = Math.cos(yaw) * -8;
      const dz = -Math.sin(yaw) * -8;
      stationGrp.position.set(relX(ns.d) + dx, 0, relZ(ns.d) + dz);
      stationGrp.rotation.y = yaw;
    }
  } else {
    stopGroup.visible = false; stationGrp.visible = false;
  }
}

function formatDist(m) {
  if (m > 1000) return (m/1000).toFixed(1) + 'km';
  return Math.round(m) + 'm';
}

function update(dt) {
  if (!G.running || G.paused) return;
  
  const kmh = G.v * 3.6;
  const lim = R.vmax;
  const grip = G.rainy ? 0.82 : 1.0;
  
  const aMotor = THROT_CURVE[G.throttleNotch] * Math.max(0.05, 1 - 0.85 * (G.v/(R.vmax/3.6))**2) * grip;
  const aBrake = BRAKE_CURVE[G.brakeNotch] * grip;
  const aDrag = DRAG * G.v * G.v + 0.05;
  
  G.v = Math.max(0, G.v + (aMotor - aBrake - aDrag) * dt);
  G.dist += G.v * dt;
  G.time += dt;

  // 安全处理：检查是否还有下一站
  if (G.stationIdx < R.stations.length) {
    const st = R.stations[G.stationIdx];
    
    if (!st.served && G.v < 1.5 && Math.abs(G.dist - st.d) <= st.half) {
      st.served = true;
      st.err = Math.abs(G.dist - st.d);
      const bonus = st.err < 30 ? 15 : (st.err < 80 ? 8 : 0);
      G.score += bonus;
      showMsg(st.name + ' 停车成功 · 误差 ' + st.err.toFixed(0) + 'm', 'good');
      if (st.final) { finishRun(true); return; }
    }
    
    if (G.dist > st.d + st.half && !st.served) {
      if (st.final) { finishRun(false, '冲过终点站'); return; }
      G.score -= 20;
      showMsg('未在 ' + st.name + ' 停车 -20', 'bad');
      st.served = true;
    }
    
    // 完全通过该站窗口后，切换目标到下一站
    if (G.dist > st.d + st.half && st.served && !st.final) {
      G.stationIdx++;
    }
  }

  if (G.dist >= R.total) { finishRun(false, '越过终点'); return; }

  document.getElementById('speedVal').firstChild.nodeValue = Math.round(kmh);
  
  if (G.stationIdx < R.stations.length) {
    const ns = R.stations[G.stationIdx];
    const rem = Math.round(ns.d - G.dist);
    document.getElementById('stopDist').textContent = ns.name + ' · ' + formatDist(rem);
  } else {
    document.getElementById('stopDist').textContent = '区间行驶';
  }

  document.getElementById('timeTxt').textContent = fmtTime(G.time);
  document.getElementById('progTxt').textContent = Math.min(100, G.dist/R.total*100).toFixed(0) + '%';
  document.getElementById('prog').firstElementChild.style.width = Math.min(100, G.dist/R.total*100) + '%';
}

function drawAlign() {
  if (G.stationIdx >= R.stations.length || !G.running || G.ended) { alignWrap.style.display = 'none'; return; }
  const st = R.stations[G.stationIdx];
  const err = G.dist - st.d;
  const RANGE = 1000;
  if (Math.abs(err) > RANGE) { alignWrap.style.display = 'none'; return; }

  alignWrap.style.display = 'block';
  const W = alignCv.width, H = alignCv.height;
  alctx.clearRect(0, 0, W, H);
  
  alctx.fillStyle = 'rgba(8,16,26,.85)'; alctx.fillRect(0,0,W,H);
  const scale = (W - 80) / (RANGE * 2);
  const cx = W/2, trackY = H * 0.62;

  alctx.strokeStyle = '#9aa8b8'; alctx.lineWidth = 4;
  alctx.beginPath(); alctx.moveTo(40, trackY); alctx.lineTo(W-40, trackY); alctx.stroke();

  const pStart = cx + (-st.half - err) * scale;
  const pEnd = cx + (st.half - err) * scale;
  alctx.fillStyle = 'rgba(47,178,79,.4)'; alctx.fillRect(pStart, trackY-34, pEnd-pStart, 22);
  alctx.strokeStyle = '#2fb24f'; alctx.lineWidth = 2; alctx.strokeRect(pStart, trackY-34, pEnd-pStart, 22);

  const sX = cx - err * scale;
  alctx.strokeStyle = '#ff3b30'; alctx.lineWidth = 6;
  alctx.beginPath(); alctx.moveTo(sX, trackY-42); alctx.lineTo(sX, trackY+20); alctx.stroke();
  alctx.fillStyle = '#ff3b30';
  alctx.beginPath(); alctx.moveTo(sX, trackY+22); alctx.lineTo(sX-10, trackY+36); alctx.lineTo(sX+10, trackY+36); alctx.fill();

  alctx.fillStyle = '#ffd54f'; alctx.fillRect(cx-16, trackY-14, 32, 28);
  alctx.strokeStyle = '#fff'; alctx.lineWidth = 3; alctx.strokeRect(cx-16, trackY-14, 32, 28);

  alctx.fillStyle = Math.abs(err)<30?'#6fe08b':Math.abs(err)<80?'#ffc85c':'#ff8d85';
  alctx.font = 'bold 24px "PingFang SC"'; alctx.textAlign = 'center';
  alctx.fillText(err>0 ? '过标 '+err.toFixed(0)+'m' : '距标 '+(-err).toFixed(0)+'m', cx, 16);
}

function loop(now) {
  const realDt = Math.min(0.05, (now - lastT) / 1000 || 0.016);
  lastT = now;
  
  if (G.running && !G.paused) {
    const totalGameDt = realDt * G.timeScale;
    const steps = Math.ceil(totalGameDt / 0.5);
    const stepDt = totalGameDt / steps;
    
    for (let i = 0; i < steps; i++) {
      update(stepDt);
      if (!G.running || G.ended) break;
    }
  }

  try {
    updateWorld();
    renderer.render(scene, camera);
    drawAlign();
    if (document.getElementById('mapModal').classList.contains('on')) {
      updateTrainMarker();
    }
  } catch (e) { console.error(e); }
  
  requestAnimationFrame(loop);
}

function buildLever(id, labels, key, emerIdx) {
  const track = document.getElementById(id); track.innerHTML = '';
  const n = labels.length;
  for(let i=0; i<n; i++) {
    const f = i/(n-1);
    const t = document.createElement('div'); t.className='tick'; t.style.bottom=(f*100)+'%'; track.appendChild(t);
    const l = document.createElement('div'); l.className='ticklbl'; l.style.bottom=(f*100)+'%'; l.textContent=labels[i]; 
    l.style[id==='throttleTrack'?'right':'left'] = 'calc(100% + 6px)'; track.appendChild(l);
  }
  const h = document.createElement('div'); h.className='handle'; track.appendChild(h);
  
  function upd() {
    const idx = G[key];
    h.style.bottom = (idx/(n-1)*100)+'%';
    h.style.transform = 'translateY(50%)';
    h.textContent = labels[idx];
    if (emerIdx != null) h.classList.toggle('emer', idx===emerIdx);
  }
  let drag = false;
  function apply(cy) {
    const r = track.getBoundingClientRect();
    let f = 1 - (cy - r.top)/r.height; f = Math.max(0, Math.min(1, f));
    G[key] = Math.round(f*(n-1));
    if(G[key] > 0) { if(key==='throttleNotch') { G.brakeNotch = 0; refreshBrk(); } else { G.throttleNotch = 0; refreshThr(); } }
    upd();
  }
  track.addEventListener('pointerdown', e => { e.preventDefault(); drag=true; track.setPointerCapture(e.pointerId); apply(e.clientY); });
  track.addEventListener('pointermove', e => { if(drag) apply(e.clientY); });
  track.addEventListener('pointerup', () => drag=false);
  return upd;
}
