<html lang="zh-CN">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1,
               user-scalable=no, viewport-fit=cover">
<meta name="description" content="Railed Echo —— 基于 Three.js 的高铁模拟驾驶游戏">
<meta name="theme-color" content="#0c1520">

<title>Railed Echo</title>

<link rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%23e8352c'/%3E%3Cpath d='M5 12h14M9 5l1.5 7M15 5l-1.5 7' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">

<style>
/* ============================================================================
   1. 基础变量与重置
   ============================================================================ */
:root {
  --red:    #e8352c;
  --amber:  #ffb020;
  --green:  #2fb24f;
  --panel:  rgba(10, 18, 28, .6);
  --line:   rgba(255, 255, 255, .14);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: #0c1520;
  color: #eaf2fa;
  font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei",
               system-ui, -apple-system, sans-serif;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
  touch-action: none;
}

/* ============================================================================
   2. 画布与背景
   ============================================================================ */
#game {
  position: fixed;
  inset: 0;
  display: block;
  touch-action: none;
}

#rain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  display: none;
}

#nightOv {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(
    ellipse at 50% 45%,
    rgba(10, 15, 40, .1),
    rgba(4, 6, 20, .85)
  );
  opacity: 0;
  transition: opacity 2s;
}

/* ============================================================================
   3. 通用面板
   ============================================================================ */
#wrap {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

.pill {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

/* ============================================================================
   4. 顶部 HUD
   ============================================================================ */
#hudTop {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: 10px 12px;
  padding-top: calc(10px + env(safe-area-inset-top));
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}

#speedBox {
  min-width: 112px;
  padding: 9px 13px;
  text-align: center;
}

#speedVal {
  font-size: 32px;
  font-weight: 800;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

#speedVal b {
  font-size: 14px;
  font-weight: 600;
  color: #9fb2c6;
  margin-left: 2px;
}

#speedLbl {
  font-size: 11px;
  color: #9fb2c6;
  margin-top: 2px;
  letter-spacing: 2px;
}

#limitTag {
  margin-top: 6px;
  padding: 3px 8px;
  font-size: 12px;
  font-weight: 700;
  border-radius: 6px;
  display: inline-block;
}

#limitTag.ok {
  background: rgba(47, 178, 79, .16);
  color: #6fe08b;
}

#limitTag.over {
  background: rgba(232, 53, 44, .2);
  color: #ff8d85;
  animation: blink .5s infinite;
}

#rightCol {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-end;
}

#rowTop {
  display: flex;
  gap: 8px;
  align-items: center;
}

.iconBtn {
  pointer-events: auto;
  width: 42px;
  height: 42px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: #eaf2fa;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.iconBtn:active {
  background: rgba(255, 255, 255, .22);
}

.stat {
  padding: 7px 11px;
  font-size: 13px;
  line-height: 1.5;
}

.stat .k {
  color: #9fb2c6;
  font-size: 11px;
}

.stat .v {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.stat .v.good { color: #6fe08b; }
.stat .v.warn { color: #ffc85c; }
.stat .v.bad  { color: #ff8d85; }

/* ============================================================================
   5. 行程进度条 & 信号灯
   ============================================================================ */
#prog {
  margin-top: 6px;
  width: 140px;
  height: 5px;
  border-radius: 3px;
  background: rgba(255, 255, 255, .12);
  overflow: hidden;
}

#prog > i {
  display: block;
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #2fb24f, #e8352c);
  transition: width .2s;
}

#sigDot {
  display: inline-block;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  vertical-align: middle;
}

#sigDot.g { background: #2fb24f; box-shadow: 0 0 8px #2fb24f; }
#sigDot.y { background: #ffb020; box-shadow: 0 0 8px #ffb020; }
#sigDot.r { background: #ff3b30; box-shadow: 0 0 10px #ff3b30; }
#sigDot.o { background: #6c7a8c; }

/* ============================================================================
   6. 中央提示
   ============================================================================ */
#centerTop {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
}

#msg {
  display: none;
  padding: 8px 16px;
  font-size: 14px;
  font-weight: 700;
  border-radius: 10px;
  white-space: nowrap;
}

#msg.on   { display: inline-block; }
#msg.good { background: rgba(16, 90, 50, .88);  color: #a7f3c4; }
#msg.warn { background: rgba(120, 70, 0, .88);  color: #ffe0a3; }
#msg.bad  { background: rgba(130, 18, 18, .92); color: #ffc4c0; }

/* ============================================================================
   7. 操纵杆
   ============================================================================ */
.lever {
  position: absolute;
  top: 150px;
  width: 52px;
  pointer-events: auto;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

#throttleLever {
  right: 10px;
  top: calc(140px + env(safe-area-inset-top));
}

#brakeLever {
  left: 10px;
  top: calc(140px + env(safe-area-inset-top));
}

.lever .cap {
  font-size: 11px;
  font-weight: 700;
  color: #9fb2c6;
  text-align: center;
  margin-bottom: 6px;
  letter-spacing: 2px;
}

.lever .track {
  position: relative;
  height: 240px;
  background: rgba(8, 14, 22, .6);
  border: 1px solid var(--line);
  border-radius: 14px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  touch-action: none;
}

.lever .tick {
  position: absolute;
  left: 8px;
  right: 8px;
  height: 1px;
  background: rgba(255, 255, 255, .16);
  pointer-events: none;
}

.lever .ticklbl {
  position: absolute;
  width: 38px;
  font-size: 10px;
  color: #b6c2d0;
  line-height: 1;
  text-align: center;
  pointer-events: none;
}

.lever .handle {
  position: absolute;
  left: 5px;
  right: 5px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 800;
  box-shadow: 0 2px 10px rgba(0, 0, 0, .5);
  transition: bottom .08s;
  pointer-events: none;
}

#throttleLever .handle {
  background: linear-gradient(180deg, #37c264, #1f8f42);
  color: #eafff0;
}

#brakeLever .handle {
  background: linear-gradient(180deg, #f0a020, #c96a10);
  color: #fff;
}

#brakeLever .handle.emer {
  background: linear-gradient(180deg, #ff5040, #b81f14);
}

/* ============================================================================
   8. 底部信息条
   ============================================================================ */
#hudBot {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 8px 12px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 12px;
}

#midInfo {
  padding: 8px 14px;
  font-size: 12px;
  line-height: 1.6;
}

#midInfo .big {
  font-size: 20px;
  font-weight: 800;
}

.hornBtn {
  pointer-events: auto;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: 1px solid rgba(232, 53, 44, .6);
  background: rgba(232, 53, 44, .3);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.hornBtn:active {
  transform: scale(.94);
  background: rgba(232, 53, 44, .5);
}

/* ============================================================================
   9. 俯视对标器
   ============================================================================ */
#alignWrap {
  position: fixed;
  bottom: 110px;
  left: 50%;
  transform: translateX(-50%);
  padding: 6px;
  display: none;
  pointer-events: none;
  z-index: 5;
  border-radius: 12px;
}

#alignCv {
  display: block;
  border-radius: 10px;
}

/* ============================================================================
   10. 菜单遮罩与卡片
   ============================================================================ */
.overlay {
  position: fixed;
  inset: 0;
  padding: 16px;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
  background: radial-gradient(
    120% 120% at 50% 0%,
    rgba(16, 28, 42, .94),
    rgba(5, 9, 16, .98)
  );
}

.overlay.hide { display: none; }

.card {
  max-width: 460px;
  width: 100%;
  padding: 22px;
  background: rgba(12, 20, 32, .94);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
}

.title {
  font-size: 24px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 10px;
}

.title .tag {
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 600;
  background: var(--red);
  color: #fff;
  border-radius: 6px;
}

.sub {
  margin-top: 6px;
  font-size: 13px;
  color: #9fb2c6;
}

/* 线路卡片 */
.routeList {
  margin: 14px 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.routeCard {
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255, 255, 255, .04);
  cursor: pointer;
}

.routeCard:active { background: rgba(255, 255, 255, .09); }

.routeCard.sel {
  border-color: var(--green);
  background: rgba(47, 178, 79, .14);
}

.routeCard .rn {
  font-size: 16px;
  font-weight: 800;
}

.routeCard .rd {
  margin-top: 3px;
  font-size: 12px;
  color: #9fb2c6;
  line-height: 1.5;
}

.routeCard .rk {
  display: inline-block;
  margin-top: 5px;
  margin-right: 5px;
  padding: 2px 7px;
  font-size: 11px;
  background: rgba(255, 255, 255, .1);
  border-radius: 5px;
}

/* 按键说明 */
.keys {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin: 12px 0;
  font-size: 12px;
}

.keys .k {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #cfdaea;
}

.key {
  display: inline-block;
  min-width: 26px;
  padding: 2px 6px;
  text-align: center;
  background: rgba(255, 255, 255, .1);
  border: 1px solid var(--line);
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
}

/* 发车按钮 */
.go {
  width: 100%;
  margin-top: 8px;
  padding: 14px;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 4px;
  background: var(--red);
  color: #fff;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

.go:active {
  transform: translateY(1px);
  background: #c92c24;
}

/* 结算行 */
.result-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px dashed rgba(255, 255, 255, .1);
  font-size: 14px;
}

.result-line:last-child { border: none; }
.result-line .l { color: #9fb2c6; }
.result-line .r {
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

#gradeBig {
  margin: 6px 0 2px;
  font-size: 60px;
  font-weight: 900;
  line-height: 1;
  text-align: center;
}

#gradeSub {
  margin-bottom: 12px;
  font-size: 13px;
  color: #9fb2c6;
  text-align: center;
}

#crashReason {
  margin-bottom: 10px;
  font-size: 14px;
  font-weight: 700;
  color: #ff8d85;
  text-align: center;
}

.hint {
  margin-top: 12px;
  font-size: 11px;
  color: #6c7a8c;
  text-align: center;
  line-height: 1.6;
}

.projectFoot {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid rgba(255, 255, 255, .08);
  font-size: 10px;
  color: #4a5568;
  text-align: center;
  line-height: 1.7;
}

.projectFoot a {
  color: #6c7a8c;
  text-decoration: none;
}

@keyframes blink {
  50% { opacity: .45; }
}

/* ============================================================================
   11. 触屏 / 平板适配
   ============================================================================ */
@media (pointer: coarse), (hover: none) {
  .lever {
    width: 64px;
    top: calc(130px + env(safe-area-inset-top));
  }
  .lever .track  { height: 280px; border-radius: 16px; }
  .lever .handle { height: 46px; font-size: 16px; border-radius: 12px; }
  .lever .cap    { font-size: 12px; }
  .lever .ticklbl { font-size: 11px; width: 44px; }

  .hornBtn { width: 76px; height: 76px; font-size: 16px; }
  .iconBtn { width: 52px; height: 52px; font-size: 16px; border-radius: 14px; }

  #speedVal  { font-size: 36px; }
  #speedBox  { min-width: 130px; padding: 11px 16px; }
  #prog      { width: 160px; height: 7px; }
  .stat      { padding: 9px 13px; font-size: 14px; }
  #midInfo   { padding: 10px 16px; font-size: 13px; }
  #midInfo .big { font-size: 24px; }

  #alignWrap { bottom: 130px; }
  #alignCv   { width: 560px; height: 148px; }

  .routeCard { padding: 16px; }
  .routeCard .rn { font-size: 17px; }
  .go        { padding: 16px; font-size: 18px; }
  .title     { font-size: 26px; }
}

@media (orientation: portrait) and (pointer: coarse) {
  .lever { top: calc(120px + env(safe-area-inset-top)); }
  .lever .track { height: 220px; }
  #alignCv { width: 460px; height: 122px; }
}

@media (max-width: 600px) {
  #speedVal  { font-size: 26px; }
  .stat      { font-size: 12px; padding: 6px 9px; }
  #prog      { width: 100px; }
  #keyHint   { display: none; }
  .title     { font-size: 21px; }
  .lever     { top: 130px; width: 48px; }
  .lever .track { height: 190px; }
  #alignCv   { width: 320px; height: 88px; }
}
</style>

</head>
<body>

<!-- ==========================================================================
     画布
     ========================================================================== -->
<canvas id="game"></canvas>
<canvas id="rain"></canvas>
<div id="nightOv"></div>

<!-- ==========================================================================
     游戏 HUD
     ========================================================================== -->
<div id="wrap">

  <!-- 顶部状态栏 -->
  <div id="hudTop">

    <div id="speedBox" class="pill">
      <div id="speedVal">0<b>km/h</b></div>
      <div id="speedLbl">当前速度</div>
      <span id="limitTag" class="ok">限速 350</span>
    </div>

    <div id="rightCol">
      <div id="rowTop">
        <div class="pill stat">
          <span class="k">行程 </span>
          <span id="progTxt" class="v">0%</span>
          <div id="prog"><i></i></div>
        </div>
        <button class="iconBtn" id="timeBtn" title="时间倍速">1x</button>
        <button class="iconBtn" id="muteBtn" title="声音开关">
          <svg viewBox="0 0 24 24" width="20" height="20"
               fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5 6 9H2v6h4l5 4V5z"/>
            <line id="muteline1" x1="22" y1="9"  x2="16" y2="15"/>
            <line id="muteline2" x1="16" y1="9"  x2="22" y2="15"/>
          </svg>
        </button>
      </div>
      <div class="pill stat"><span class="k">时刻 </span><span id="timeTxt" class="v">00:00</span></div>
      <div class="pill stat"><span class="k">准点 </span><span id="puncTxt" class="v good">±0s</span></div>
    </div>

  </div>

  <!-- 中央提示 -->
  <div id="centerTop"><div id="msg"></div></div>

  <!-- 操纵杆 -->
  <div class="lever" id="brakeLever">
    <div class="cap">制动</div>
    <div class="track" id="brakeTrack"></div>
  </div>
  <div class="lever" id="throttleLever">
    <div class="cap">牵引</div>
    <div class="track" id="throttleTrack"></div>
  </div>

  <!-- 底部信息条 -->
  <div id="hudBot">
    <div id="midInfo" class="pill">
      <div><span class="k">下一信号 </span><span id="sigDot" class="o"></span> <span id="sigTxt">--</span></div>
      <div><span class="k">牵引 </span><span id="thrVal">0</span> 档 · <span class="k">制动 </span><span id="brkVal">缓解</span></div>
      <div><span class="k">下一站 </span><span id="stopDist" class="big">--</span></div>
      <div><span class="k">评分 </span><span id="scoreTxt" class="v warn">100</span></div>
    </div>
    <button class="hornBtn" id="btnHorn">鸣笛</button>
  </div>

  <!-- 俯视对标器 -->
  <div id="alignWrap" class="pill">
    <canvas id="alignCv" width="1120" height="296"
            style="width:560px;height:148px;"></canvas>
  </div>

</div>

<!-- ==========================================================================
     开始菜单
     ========================================================================== -->
<div class="overlay" id="startOv">
  <div class="card">

    <div class="title">Railed Echo<span class="tag">双线站台</span></div>
    <div class="sub">左线行驶 · 站台对标 · 精准停车</div>

    <div class="routeList" id="routeList"></div>

    <div class="keys" id="keyHint">
      <div class="k"><span class="key">W/↑</span> 牵引加档</div>
      <div class="k"><span class="key">S/↓</span> 牵引减档</div>
      <div class="k"><span class="key">A</span> 制动减档 · <span class="key">D</span> 加档</div>
      <div class="k"><span class="key">空格</span> 鸣笛 · <span class="key">P</span> 暂停</div>
      <div class="k"><span class="key">C</span> 切换视角</div>
      <div class="k"><span class="key">M</span> 静音</div>
    </div>

    <button class="go" id="startBtn">发 车</button>

    <div class="hint">
      进入车站前 200m 会弹出俯视对标器<br>
      把红色停车标对准中央列车即精准停车
    </div>

    <div class="projectFoot">
      Railed Echo · AGPL-3.0<br>
      <a href="https://github.com/a-cathay-359/railed-echo" target="_blank" rel="noopener">
        github.com/a-cathay-359/railed-echo
      </a>
    </div>

  </div>
</div>

<!-- ==========================================================================
     结算菜单
     ========================================================================== -->
<div class="overlay hide" id="endOv">
  <div class="card">
    <div class="title" id="endTitle">任务完成</div>
    <div id="crashReason" style="display:none"></div>
    <div id="gradeBig">S</div>
    <div id="gradeSub">全速准点 · 车长典范</div>
    <div id="endBody"></div>
    <button class="go" id="againBtn">再跑一趟</button>

function initAudio() {

  if (actx) return;

  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();

    engGain = actx.createGain();
    engGain.gain.value = 0;

    engFlt = actx.createBiquadFilter();
    engFlt.type = 'lowpass';
    engFlt.frequency.value = 600;

    engO1 = actx.createOscillator();
    engO1.type = 'sawtooth';
    engO1.frequency.value = 30;

    engO2 = actx.createOscillator();
    engO2.type = 'sawtooth';
    engO2.frequency.value = 45;

    const g2 = actx.createGain();
    g2.gain.value = 0.5;

    engO2.connect(g2);
    engO1.connect(engFlt);
    g2.connect(engFlt);
    engFlt.connect(engGain);
    engGain.connect(actx.destination);

    engO1.start();
    engO2.start();

  } catch (e) {
    actx = null;
  }

}

function updateAudio() {

  if (!actx || muted || !G.running || G.paused) {
    if (engGain && actx) {
      engGain.gain.setTargetAtTime(0, actx.currentTime, 0.1);
    }
    return;
  }

  const kmh = G.v * 3.6;

  engO1.frequency.setTargetAtTime(28 + kmh * 0.75, actx.currentTime, 0.08);
  engO2.frequency.setTargetAtTime(42 + kmh * 1.10, actx.currentTime, 0.08);

  engGain.gain.setTargetAtTime(
    Math.min(0.22, 0.04 + kmh * 0.0005),
    actx.currentTime,
    0.1
  );

}

function brakeSqueal() {

  if (!actx || muted) return;

  const t = actx.currentTime;

  const o = actx.createOscillator();
  o.type = 'square';
  o.frequency.value = 1800 + Math.random() * 600;

  const g = actx.createGain();
  g.gain.value = 0;
  g.gain.linearRampToValueAtTime(0.09, t + 0.03);
  g.gain.setTargetAtTime(0, t + 0.1, 0.12);

  o.connect(g);
  g.connect(actx.destination);

  o.start(t);
  o.stop(t + 0.5);

}

function horn() {

  if (!actx || muted) return;

  const t = actx.currentTime;

  [523, 659].forEach(f => {
    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.value = f;

    const gn = actx.createGain();
    gn.gain.setValueAtTime(0, t);

    gn.gain.linearRampToValueAtTime(0.26, t + 0.60);

    o.connect(gn);
    gn.connect(actx.destination);

    o.start(t);
    o.stop(t + 1.0);
  });

}

  ctx.fillStyle = '#0d2a52';

/* ============================================================================
 * 7. 动态更新
 * ============================================================================ */
function updateWorld() {

  const d    = G.dist;
  const camX = trackX(d);

  /* ---- 7.1 昼夜 ---- */
  const night = Math.max(0, Math.min(1, (G.time - 200) / 120));
  G.night = night;

  document.getElementById('nightOv').style.opacity = (night * 0.45).toFixed(3);

  ambient.intensity = 0.9 - night * 0.55;
  sun.intensity     = 0.75 * (1 - night * 0.8);
  sun.color.setHSL(0.1, 0.35, 0.55 + 0.35 * (1 - night));

  _sky.setHex(R.sky).lerp(new THREE.Color(0x0a1220), night);
  _fog.setHex(R.fog).lerp(new THREE.Color(0x121a2a), night);

  /* ---- 7.2 隧道 ---- */
  const inTunnel = !!(R.tunnel && d >= R.tunnel.d && d < R.tunnel.end);

  if (inTunnel) {
    scene.background = _tunnelCol;
    sceneFog.color.setHex(0x0a0d10);
    sceneFog.near = 5;
    sceneFog.far  = 80;
  } else {
    scene.background = _sky;
    sceneFog.color.copy(_fog);
    sceneFog.near = 40;
    sceneFog.far  = 700;
  }

  /* ---- 7.3 相机 ---- */
  if (G.camMode === 0) {

    const lookD = d + 45;
    const lx    = trackX(lookD) - camX;

    camera.position.set(0, CAM_Y, 0);
    camera.lookAt(lx * 0.7, CAM_Y - 0.3, -45);

    myTrain.visible = false;

  } else if (G.camMode === 1) {

    camera.position.set(0, 14, 42);
    camera.lookAt(0, 1.5, 0);

    myTrain.visible = true;

  } else {

    camera.position.set(13, 5, 18);
    camera.lookAt(0, 1.8, -2);

    myTrain.visible = true;

  }

  /* ---- 7.4 本车模型 ---- */
  myTrain.position.set(0, 0, 0);
  myTrain.rotation.y = 0;

  /* ---- 7.5 分段轨道 ---- */
  for (const seg of segments) {

    let wd = seg.userData.worldD;

    while (wd - d <  -SEG_LEN)            wd += SEG_TOTAL;
    while (wd - d >  SEG_TOTAL - SEG_LEN) wd -= SEG_TOTAL;

    seg.userData.worldD = wd;

    const mid = wd + SEG_LEN / 2;
    seg.position.set(relX(mid), 0, relZ(mid));
    seg.rotation.y = yawAt(mid);

  }

  /* ---- 7.6 枕木 ---- */
  for (const m of sleepers) {

    let wd = m.userData.worldD;

    while (wd - d <  -SLEEPER_STEP)              wd += SLEEPER_TOTAL;
    while (wd - d >  SLEEPER_TOTAL - SLEEPER_STEP) wd -= SLEEPER_TOTAL;

    m.userData.worldD = wd;

    m.position.set(relX(wd, m.userData.lineOffset), 0.18, relZ(wd));
    m.rotation.y = yawAt(wd);

  }

  /* ---- 7.7 接触网 ---- */
  for (const p of poles) {

    let wd = p.userData.worldD;

    while (wd - d <  -POLE_STEP)           wd += POLE_TOTAL;
    while (wd - d >  POLE_TOTAL - POLE_STEP) wd -= POLE_TOTAL;

    p.userData.worldD = wd;

    const sideOff = p.userData.side * 4.6;

    p.position.set(relX(wd, sideOff), 4.5, relZ(wd));
    p.rotation.y = yawAt(wd);

  }

  /* ---- 7.8 树木 ---- */
  for (const t of trees) {

    let wd = t.userData.worldD;

    while (wd - d <  -TREE_STEP)           wd += TREE_TOTAL;
    while (wd - d >  TREE_TOTAL - TREE_STEP) wd -= TREE_TOTAL;

    t.userData.worldD = wd;

    const sideOff = t.userData.side * t.userData.off;

    t.position.set(relX(wd, sideOff), 1.8 * t.userData.s, relZ(wd));
    t.rotation.y = yawAt(wd) * 0.3;

  }

  /* ---- 7.9 房屋 ---- */
  for (const b of blds) {

    let wd = b.userData.worldD;

    while (wd - d <  -BLD_STEP)           wd += BLD_TOTAL;
    while (wd - d >  BLD_TOTAL - BLD_STEP) wd -= BLD_TOTAL;

    b.userData.worldD = wd;
    b.visible = b.userData.show;

    if (b.visible) {

      const sideOff = b.userData.side * b.userData.off;

      b.position.set(relX(wd, sideOff), 3.5 * b.userData.s, relZ(wd));
      b.rotation.y = yawAt(wd) * 0.3;

    }

  }

  /* ---- 7.10 地面 ---- */
  ground.position.set(camX, -0.2, -(d + 1000));
  ground.material.color.setHex(R.ground);

  /* ---- 7.11 远山 ---- */
  for (const m of mountainGroup.children) {

    const wd     = m.userData.worldD;
    const relZv  = relZ(wd);

    m.visible = relZv > -1800 && relZv < 200;

    if (m.visible) {
      m.position.x = relX(wd, m.userData.off);
      m.position.z = relZv;
    }

  }

  /* ---- 7.12 云 ---- */
  for (const c of clouds) {

    let wd = c.userData.worldD;

    while (wd - d <  -400) wd += 12 * 180;
    while (wd - d >  12 * 180 - 400) wd -= 12 * 180;

    c.userData.worldD = wd;

    c.position.x = relX(wd, c.userData.off);
    c.position.z = relZ(wd);
    c.position.y = c.userData.y;

  }

  /* ---- 7.13 站台 ---- */
  for (const sg of stationGroups) {

    const st      = sg.st;
    const relDist = st.d - d;

    const show = relDist > -600 && relDist < 800;
    sg.group.visible = show;

    if (show) {

      const yaw = yawAt(st.d);
      const dx  = Math.cos(yaw) * sg.offX;
      const dz  = -Math.sin(yaw) * sg.offX;

      sg.group.position.set(
        relX(st.d) + dx,
        0,
        relZ(st.d) + dz
      );
      sg.group.rotation.y = yaw;

    }

  }

  /* ---- 7.14 停车标 ---- */
  const ns = R.stations[G.stationIdx];

  if (ns) {

    const relDist = ns.d - d;
    const near    = relDist > -150 && relDist < 500;

    stopMarkGroup.visible = near;

    if (near) {

      const yaw   = yawAt(ns.d);
      const offX  = -HALF_GAUGE - 0.4;
      const dx    = Math.cos(yaw) * offX;
      const dz    = -Math.sin(yaw) * offX;

      stopMarkGroup.position.set(
        relX(ns.d) + dx,
        0,
        relZ(ns.d) + dz
      );
      stopMarkGroup.rotation.y = yaw;

      stopMarkGroup.children[1].material.color.setHex(
        ns.final ? 0xff3b30 : 0xffb020
      );

    }

  } else {
    stopMarkGroup.visible = false;
  }

  /* ---- 7.15 信号机 ---- */
  for (const g of sigGroup.children) {

    const s       = g.userData.sig;
    const relDist = s.d - d;

    const show = !s.passed && relDist > -30 && relDist < 700;
    g.visible = show;

    if (show) {

      g.position.set(relX(s.d, 3.6), 0, relZ(s.d));
      g.rotation.y = yawAt(s.d);

      const col = s.state === 'green'  ? 0x2fb24f
                : s.state === 'yellow' ? 0xffb020
                :                        0xff3b30;

      g.userData.lamp.material.color.setHex(col);

    }

  }

  /* ---- 7.16 会车 ---- */
  let seen = false;

  for (const mt of R.meets.concat(G.extraMeets)) {

    const relDist = mt.d - d;

    if (relDist > -150 && relDist < 900) {

      oTrain.position.set(relX(mt.d, OPP_X), 0, relZ(mt.d));
      oTrain.rotation.y = yawAt(mt.d) + Math.PI;
      oTrain.visible = true;
      seen = true;

    }

  }

  if (!seen) oTrain.visible = false;

  /* ---- 7.17 河流 ---- */
  if (G.riverD) {

    const relDist = G.riverD - d;
    const near    = relDist > -350 && relDist < 350;

    river.visible = near;

    if (near) {
      river.position.set(relX(G.riverD), -0.15, relZ(G.riverD));
      river.rotation.z = yawAt(G.riverD);
    }

  }

  /* ---- 7.18 隧道实体 ---- */
  tunnelMesh.visible = inTunnel;

  if (inTunnel) {
    tunnelMesh.position.set(camX, 6, relZ(d) - 20);
    tunnelMesh.rotation.y = yawAt(d);
  }

}


/* ============================================================================
 * 8. 俯视对标器
 * ============================================================================ */
const alignCv   = document.getElementById('alignCv');
const alctx     = alignCv.getContext('2d');
const alignWrap = document.getElementById('alignWrap');

function drawAlign() {

  const st = R.stations[G.stationIdx];

  if (!st || !G.running) {
    alignWrap.style.display = 'none';
    return;
  }

  const err   = G.dist - st.d;
  const RANGE = 200;

  if (Math.abs(err) > RANGE) {
    alignWrap.style.display = 'none';
    return;
  }

  alignWrap.style.display = 'block';

  const W = alignCv.width;
  const H = alignCv.height;

  alctx.clearRect(0, 0, W, H);

  /* 背景 */
  alctx.fillStyle = 'rgba(8,16,26,.85)';
  alctx.fillRect(0, 0, W, H);

  alctx.strokeStyle = 'rgba(255,255,255,.10)';
  alctx.lineWidth = 2;
  alctx.strokeRect(1, 1, W - 2, H - 2);

  const padX   = 40;
  const innerW = W - padX * 2;
  const scale  = innerW / (RANGE * 2);
  const cx     = W / 2;
  const trackY = H * 0.62;

  /* 主轨道 */
  alctx.strokeStyle = '#9aa8b8';
  alctx.lineWidth = 4;
  alctx.beginPath();
  alctx.moveTo(padX, trackY);
  alctx.lineTo(W - padX, trackY);
  alctx.stroke();

  /* 每 50m 刻度 */
  alctx.strokeStyle = 'rgba(255,255,255,.22)';
  alctx.lineWidth = 2;

  for (let m = -RANGE; m <= RANGE; m += 50) {

    const x = cx + m * scale;

    alctx.beginPath();
    alctx.moveTo(x, trackY - 6);
    alctx.lineTo(x, trackY + 6);
    alctx.stroke();

  }

  /* 站台带 */
  const platStart = cx + (-st.half - err) * scale;
  const platEnd   = cx + ( st.half - err) * scale;

  alctx.fillStyle = 'rgba(47,178,79,.4)';
  alctx.fillRect(platStart, trackY - 34, platEnd - platStart, 22);

  alctx.strokeStyle = '#2fb24f';
  alctx.lineWidth = 2;
  alctx.strokeRect(platStart, trackY - 34, platEnd - platStart, 22);

  alctx.fillStyle = '#c8ffd6';
  alctx.font = 'bold 22px "PingFang SC","Noto Sans SC",sans-serif';
  alctx.textAlign = 'center';
  alctx.textBaseline = 'middle';

  if (platEnd - platStart > 90) {
    alctx.fillText(st.name, (platStart + platEnd) / 2, trackY - 23);
  }

  /* 停车标 */
  const stopX = cx - err * scale;

  alctx.strokeStyle = '#ff3b30';
  alctx.lineWidth = 6;
  alctx.beginPath();
  alctx.moveTo(stopX, trackY - 42);
  alctx.lineTo(stopX, trackY + 20);
  alctx.stroke();

  alctx.fillStyle = '#ff3b30';
  alctx.beginPath();
  alctx.moveTo(stopX,      trackY + 22);
  alctx.lineTo(stopX - 10, trackY + 36);
  alctx.lineTo(stopX + 10, trackY + 36);
  alctx.closePath();
  alctx.fill();

  /* 列车 */
  alctx.fillStyle = '#ffd54f';
  alctx.fillRect(cx - 16, trackY - 14, 32, 28);

  alctx.strokeStyle = '#ffffff';
  alctx.lineWidth = 3;
  alctx.strokeRect(cx - 16, trackY - 14, 32, 28);

  /* 误差 */
  alctx.textAlign = 'center';
  alctx.textBaseline = 'top';
  alctx.font = 'bold 24px "PingFang SC","Noto Sans SC",sans-serif';

  if      (Math.abs(err) < 15) alctx.fillStyle = '#6fe08b';
  else if (Math.abs(err) < 40) alctx.fillStyle = '#ffc85c';
  else                         alctx.fillStyle = '#ff8d85';

  const txt = err > 0
    ? ('过标 ' + err.toFixed(1) + ' m')
    : ('距标 ' + (-err).toFixed(1) + ' m');

  alctx.fillText(txt, cx, 12);

  /* 范围标注 */
  alctx.fillStyle = 'rgba(200,214,228,.6)';
  alctx.font = '16px "PingFang SC","Noto Sans SC",sans-serif';

  alctx.textAlign = 'left';
  alctx.fillText('前方 ' + RANGE + 'm', padX, H - 28);

  alctx.textAlign = 'right';
  alctx.fillText('后方 ' + RANGE + 'm', W - padX, H - 28);

}

const THR_LABEL = ['切', '1', '2', '3', '4', '5'];
const BRK_LABEL = ['缓解', '1', '2', '3', '4', '紧急'];

function buildLever(trackId, labels, onChange, emerIdx) {

  const track = document.getElementById(trackId);
  track.innerHTML = '';

  const n = labels.length;

  for (let i = 0; i < n; i++) {

    const frac = i / (n - 1);

    const tick = document.createElement('div');
    tick.className = 'tick';
    tick.style.bottom = (frac * 100) + '%';

    const lbl = document.createElement('div');
    lbl.className = 'ticklbl';
    lbl.style.bottom = 'calc(' + (frac * 100) + '% - 6px)';

    if (trackId === 'throttleTrack') {
      lbl.style.right = 'calc(100% + 6px)';
    } else {
      lbl.style.left = 'calc(100% + 6px)';
    }

    lbl.textContent = labels[i];

    track.appendChild(tick);
    track.appendChild(lbl);

  }

  const handle = document.createElement('div');
  handle.className = 'handle';
  track.appendChild(handle);

  function upd() {

    const idx = (trackId === 'throttleTrack')
      ? G.throttleNotch
      : G.brakeNotch;

    handle.style.bottom = 'calc(' + (idx / (n - 1) * 100) + '% - 20px)';
    handle.textContent = labels[idx];

    if (emerIdx != null) {
      handle.classList.toggle('emer', idx === emerIdx);
    }

  }

  let drag = false;

  function apply(cy) {
    const r = track.getBoundingClientRect();
    let f = 1 - (cy - r.top) / r.height;
    f = Math.max(0, Math.min(1, f));
    onChange(Math.round(f * (n - 1)));
    upd();
  }

  track.addEventListener('pointerdown', e => {
    e.preventDefault();
    drag = true;
    try { track.setPointerCapture(e.pointerId); } catch (_) {}
    apply(e.clientY);
  });

  track.addEventListener('pointermove', e => {
    if (drag) {
      e.preventDefault();
      apply(e.clientY);
    }
  });

  const end = () => { drag = false; };

  track.addEventListener('pointerup', end);
  track.addEventListener('pointercancel', end);
  track.addEventListener('lostpointercapture', end);

  return upd;

}

let refreshThr, refreshBrk;

refreshThr = buildLever('throttleTrack', THR_LABEL, i => {
  G.throttleNotch = i;
  if (i > 0 && G.brakeNotch > 0) {
    G.brakeNotch = 0;
    refreshBrk();
  }
}, null);

refreshBrk = buildLever('brakeTrack', BRK_LABEL, i => {
  G.brakeNotch = i;
  if (i > 0 && G.throttleNotch > 0) {
    G.throttleNotch = 0;
    refreshThr();
  }
}, 5);


/* ---- 键盘 ---- */
document.addEventListener('keydown', e => {

  if (e.repeat) return;

  if (e.code === 'Space' || e.code === 'KeyH') {
    e.preventDefault();
    horn();
  }

  if (e.code === 'KeyP') {
    e.preventDefault();
    togglePause();
  }

  if (e.code === 'KeyM') document.getElementById('muteBtn').click();

  if (e.code === 'KeyC') {
    G.camMode = (G.camMode + 1) % 3;
    showMsg(['驾驶室视角', '高空跟随', '侧后回望'][G.camMode], 'warn');
  }

  if (e.code === 'KeyR' && G.ended) startRun();

  if (G.running && !G.paused) {

    if (e.code === 'KeyW' || e.code === 'ArrowUp') {
      G.throttleNotch = Math.min(5, G.throttleNotch + 1);
      if (G.throttleNotch > 0 && G.brakeNotch > 0) G.brakeNotch = 0;
      refreshThr(); refreshBrk();
    }

    if (e.code === 'KeyS' || e.code === 'ArrowDown') {
      G.throttleNotch = Math.max(0, G.throttleNotch - 1);
      refreshThr();
    }

    if (e.code === 'KeyD' || e.code === 'ArrowRight') {
      G.brakeNotch = Math.min(5, G.brakeNotch + 1);
      if (G.brakeNotch > 0 && G.throttleNotch > 0) G.throttleNotch = 0;
      refreshThr(); refreshBrk();
    }

    if (e.code === 'KeyA' || e.code === 'ArrowLeft') {
      G.brakeNotch = Math.max(0, G.brakeNotch - 1);
      refreshBrk();
    }

  }

});

/* ---- 10.1 构建线路 ---- */
function buildRoute() {

  zones = R.zones.map(z => ({
    d: z.d,
    end: z.end,
    limit: z.limit
  }));

  signals = [];

  for (const s of R.signals) {
    signals.push({
      d: s.d,
      kind: 'slow',
      name: s.name,
      limit: s.limit || Math.round(R.vmax * 0.6),
      passed: false,
      state: 'red',
      praised: false
    });
  }

  R.stations.forEach(st => {

    st.served = false;
    st.err = null;

    if (!st.final) {
      signals.push({
        d: Math.max(500, st.d - 1500),
        kind: 'station',
        name: st.name + ' 预告信号',
        limit: R.vmax,
        passed: false,
        state: 'yellow',
        praised: false
      });
    }

  });

  signals.sort((a, b) => a.d - b.d);

}

function currentLimit() {

  let lim = R.vmax;

  for (const z of zones) {
    if (G.dist >= z.d && G.dist < z.end) {
      lim = Math.min(lim, z.limit);
    }
  }

  return lim;

}

function hash(n) {
  const x = Math.sin(n * 127.1) * 43758.5453;
  return x - Math.floor(x);
}

    if (b) {
      const rec = JSON.parse(b);
      bestTxt = '<span class="rk">最佳 ' + rec.score + '分 ' + rec.grade + '</span>';
    }
  } catch (e) {}

  c.innerHTML =
    '<div class="rn">' + r.name + '</div>' +
    '<div class="rd">' + r.sub + ' · 全程 ' + (r.total / 1000).toFixed(1) + ' km · 限速 ' + r.vmax + '</div>' +
    '<span class="rk">' + r.stations.length + ' 站停靠</span>' +
    '<span class="rk">双线</span>' +
    '<span class="rk">会车</span>' + bestTxt;

  c.addEventListener('click', () => {
    routeKey = key;
    R = ROUTES[key];
    document.querySelectorAll('.routeCard').forEach(x => x.classList.remove('sel'));
    c.classList.add('sel');
  });

  routeListEl.appendChild(c);

});

/* ---- 10.3 开始 / 结束 ---- */
document.getElementById('startBtn').addEventListener('click', startRun);
document.getElementById('againBtn').addEventListener('click', startRun);

function startRun() {

  initAudio();
  if (actx && actx.state === 'suspended' && !muted) actx.resume();

  R = ROUTES[routeKey];

  buildRoute();
  buildSignals();
  buildStations();

  G.running = true;
  G.ended   = false;
  G.paused  = false;

  G.dist  = 0;
  G.v     = 0;
  G.time  = 0;
  G.score = 100;

  G.throttleNotch = 0;
  G.brakeNotch    = 0;

  G.overspeedSec = 0;
  G.atpSec       = 0;
  G.atpActive    = false;

  G.arrived     = false;
  G.crashReason = '';
  G.stopBonus   = 0;
  G.stopErr     = null;

  G.stationIdx = 0;
  G.metSet     = {};

  G.announced = false;
  G.newBest   = false;
  G.camMode   = 0;

  G.riverD = 3000 + Math.random() * (R.total - 6000);

  G.extraMeets = [];
  const extra = Math.floor(Math.random() * 3);
  for (let i = 0; i < extra; i++) {
    G.extraMeets.push({ d: 1500 + Math.random() * (R.total - 3000) });
  }

  G.rainy = Math.random() < 0.35;
  document.getElementById('rain').style.display = G.rainy ? 'block' : 'none';

  harshCooldown = 0;
  msgTimer      = 0;
  lastT         = performance.now();

  document.getElementById('startOv').classList.add('hide');
  document.getElementById('endOv').classList.add('hide');

  refreshThr();
  refreshBrk();

  showMsg(
    G.rainy ? '今日有雨 · 制动距离延长' : ('发车 · ' + R.sub),
    G.rainy ? 'warn' : 'good'
  );

}

function finishRun(ok, reason) {

  G.running = false;
  G.ended   = true;

  if (!ok) {
    G.score = 0;
    G.crashReason = reason || '任务失败';
  } else {
    G.arrived = true;

    const diff  = G.time - R.target;
    const bonus = Math.abs(diff) <= 20 ? 15
                : Math.abs(diff) <= 60 ? 5
                : -10;

    G.score = Math.max(0, Math.round(G.score + bonus));

    const prev = getBest();
    G.newBest = G.score > (prev ? prev.score : 0);

    if (G.newBest) {
      setBest({
        score: G.score,
        grade: scoreGrade(G.score).g,
        t: Math.round(G.time)
      });
    }
  }

  showEnd();

}

function showEnd() {

  const lastSt = R.stations[R.stations.length - 1];

  document.getElementById('endTitle').textContent =
    G.arrived ? ('到达 ' + lastSt.name) : '行车事故';

  const c = document.getElementById('crashReason');
  c.style.display = G.arrived ? 'none' : 'block';
  if (!G.arrived) c.textContent = G.crashReason;

  const g  = scoreGrade(G.score);
  const gb = document.getElementById('gradeBig');

  gb.textContent = g.g;
  gb.style.color = g.c;

  document.getElementById('gradeSub').textContent = g.d;

  const diff = G.time - R.target;
  const punc = G.arrived
    ? (diff <= 0 ? ('早点 ' + fmtTime(-diff)) : ('晚点 ' + fmtTime(diff)))
    : '—';

  const avg = G.arrived ? (G.dist / 1000) / (G.time / 3600) : 0;

  let b = '';

  b += row('线路', R.name);
  b += row('用时', fmtTime(G.time));
  b += row('行程', (G.dist / 1000).toFixed(2) + ' km');
  b += row('平均速度', G.arrived ? avg.toFixed(0) + ' km/h' : '—');
  b += row('准点', punc);

  for (const st of R.stations) {

    const v = st.err != null
      ? ('误差 ' + st.err.toFixed(1) + ' m')
      : (st.served ? '—' : '未停车');

    b += row('· ' + st.name, v);

  }

  b += row('停靠加分', '+' + G.stopBonus);
  b += row('超速时长', G.overspeedSec.toFixed(1) + ' s');
  b += row('ATP 干预', G.atpSec.toFixed(1) + ' s');
  b += row('最终评分', G.score + ' 分' + (G.newBest ? ' · 新纪录！' : ''));

  document.getElementById('endBody').innerHTML = b;
  document.getElementById('endOv').classList.remove('hide');

}

function row(l, r) {
  return '<div class="result-line">'
       + '<span class="l">' + l + '</span>'
       + '<span class="r">' + r + '</span>'
       + '</div>';
}

function scoreGrade(s) {
  if (s >= 95) return { g: 'S', d: '全速准点 · 车长典范', c: '#ffc85c' };
  if (s >= 82) return { g: 'A', d: '运行平稳 · 表现优秀', c: '#6fe08b' };
  if (s >= 68) return { g: 'B', d: '基本达标 · 尚有提升', c: '#7fd0ff' };
  if (s >= 50) return { g: 'C', d: '勉强合格 · 注意纪律', c: '#ffc85c' };
  return         { g: 'D', d: '需要回炉 · 安全第一', c: '#ff8d85' };
}

function fmtTime(s) {
  s = Math.max(0, Math.round(s));
  const m  = Math.floor(s / 60);
  const ss = s % 60;
  return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss;
}

function bestKey() {
  return 'railed_echo_best_' + routeKey;
}

function getBest() {
  try {
    const v = localStorage.getItem(bestKey());
    return v ? JSON.parse(v) : null;
  } catch (e) {
    return null;
  }
}

function setBest(rec) {
  try { localStorage.setItem(bestKey(), JSON.stringify(rec)); } catch (e) {}
}

function showMsg(t, type) {
  const m = document.getElementById('msg');
  m.textContent = t;
  m.className = 'on ' + type;
  msgTimer = 3.0;
}


/* ============================================================================
 * 11. 主逻辑与循环
 * ============================================================================ */
const speedValEl = document.getElementById('speedVal');
const sigTxtEl   = document.getElementById('sigTxt');
const sigDotEl   = document.getElementById('sigDot');
const stopDistEl = document.getElementById('stopDist');

function update(dt) {

  if (!G.running || G.paused) {
    updateAudio();
    return;
  }

  const kmh    = G.v * 3.6;
  const lim    = currentLimit();
  const vmaxMs = R.vmax / 3.6;
  const ratio  = Math.min(1, G.v / vmaxMs);
  const grip   = G.rainy ? 0.82 : 1.0;

  /* ---- 11.1 运动学 ---- */
  const aMotor = THROT_CURVE[G.throttleNotch]
               * Math.max(0.08, 1 - 0.88 * ratio * ratio)
               * grip;

  const aDrag  = DRAG * G.v * G.v + 0.03;
  const aBrake = BRAKE_CURVE[G.brakeNotch] * grip;

  /* ATP 超速自动防护 */
  const over = kmh - lim;

  if (over > 8) G.atpActive = true;
  if (over < 2) G.atpActive = false;

  const aAtp = G.atpActive ? 2.2 : 0;

  if (G.atpActive) {
    G.atpSec += dt;
    G.score -= dt * 0.8;
  }

  const vPrev = G.v;

  G.v = Math.max(
    0,
    G.v + (aMotor - aDrag - aBrake - aAtp) * dt
  );

  G.dist += G.v * dt;
  G.time += dt;

  if (kmh > lim + 3) {
    G.overspeedSec += dt;
    G.score -= dt * 1.0;
  }

  /* 急刹检测 */
  const dec = (vPrev - G.v) / dt;

  harshCooldown -= dt;

  if (G.brakeNotch > 0 && dec > 3.6 && vPrev > 8 && harshCooldown <= 0) {
    G.score -= 2;
    harshCooldown = 1.5;
    showMsg('急刹车 -2', 'warn');
    brakeSqueal();
  }

  /* ---- 11.2 信号判定 ---- */
  let nextSig = null;

  for (const s of signals) {

    if (!nextSig && !s.passed) nextSig = s;

    const ahead = s.d - G.dist;

    if (s.kind === 'slow' && !s.passed) {

      if (ahead < 500 && ahead > -20) {

        if (kmh <= s.limit) {

          if (s.state !== 'green') {

            s.state = 'green';

            if (!s.praised) {
              s.praised = true;
              G.score += 6;
              showMsg('已按规定降速 · +6', 'good');
            }

          }

        } else {

          s.state = 'red';
          G.score -= dt * 1.5;

        }

      }

      if (G.dist >= s.d) {

        s.passed = true;

        if (kmh > s.limit) {
          G.score -= 15;
          showMsg('未按规定减速通过慢行信号 -15', 'bad');
        }

      }

    } else if (!s.passed && G.dist >= s.d) {

      s.passed = true;

      if (s.kind === 'station') {
        showMsg('已通过 ' + s.name, 'good');
      }

    }

  }

  /* ---- 11.3 车站停靠 ---- */
  const st = R.stations[G.stationIdx];

  if (st) {

    /* 停车成功 */
    if (!st.served && G.v < 0.9 && Math.abs(G.dist - st.d) <= st.half) {

      st.served = true;
      st.err    = Math.abs(G.dist - st.d);

      const bonus = st.err < 15 ? 12 : (st.err < 40 ? 6 : 0);

      G.score     += bonus;
      G.stopBonus += bonus;

      showMsg(
        st.name + ' 停车成功 · 误差 ' + st.err.toFixed(1) + 'm'
        + (bonus ? ' · +' + bonus : ''),
        'good'
      );

      if (st.final) {
        G.stopErr = st.err;
        finishRun(true);
        return;
      }

    }

    /* 冲过停车窗口 */
    if (G.dist > st.d + st.half) {

      if (!st.served) {

        if (st.final) {
          finishRun(false, '冲过终点站，未停车');
          return;
        }

        G.score -= 18;
        showMsg('未在 ' + st.name + ' 停车 -18', 'bad');
        st.served = true;

      }

      if (!st.final) G.stationIdx++;

    }

  }

  /* ---- 11.4 会车提示 ---- */
  for (const mt of R.meets.concat(G.extraMeets)) {
    if (!G.metSet[mt.d] && Math.abs(G.dist - mt.d) < 70) {
      G.metSet[mt.d] = true;
      showMsg('对向列车会车通过', 'good');
    }
  }

  /* ---- 11.5 终点站预告 ---- */
  const finalSt = R.stations[R.stations.length - 1];

  if (!G.announced && finalSt && G.dist > finalSt.d - 2500) {
    G.announced = true;
    showMsg('即将到达 ' + finalSt.name + ' · 请减速停车', 'warn');
    horn();
  }

  if (G.dist >= R.total) {
    finishRun(false, '越过线路终点');
    return;
  }

  /* ---- 11.6 HUD 刷新 ---- */
  const tag = document.getElementById('limitTag');
  tag.textContent = '限速 ' + lim;
  tag.className   = (kmh > lim + 3) ? 'over' : 'ok';

  if (speedValEl.firstChild) {
    speedValEl.firstChild.nodeValue = String(Math.round(kmh));
  }

  /* 信号灯 */
  if (nextSig) {

    sigTxtEl.textContent = nextSig.name + ' · '
      + Math.round(Math.max(0, nextSig.d - G.dist)) + 'm';

    sigDotEl.className = nextSig.state === 'green'  ? 'g'
                       : nextSig.state === 'yellow' ? 'y'
                       :                              'r';

  } else {

    sigTxtEl.textContent = '区间畅通';
    sigDotEl.className   = 'o';

  }

  document.getElementById('thrVal').textContent = G.throttleNotch;
  document.getElementById('brkVal').textContent = BRK_LABEL[G.brakeNotch];

  /* 下一站距离 */
  const ns = R.stations[G.stationIdx];

  if (ns) {

    const rem = Math.round(ns.d - G.dist);

    stopDistEl.textContent = ns.name + ' · '
      + (rem > 0 ? (rem + 'm') : ('过 ' + Math.abs(rem) + 'm'));

    stopDistEl.style.color = Math.abs(rem) < 60 ? '#6fe08b' : '';

  } else {

    stopDistEl.textContent = '—';

  }

  /* 时刻 / 准点 */
  document.getElementById('timeTxt').textContent = fmtTime(G.time);

  const diff = G.time - R.target;
  const pc   = document.getElementById('puncTxt');

  pc.textContent = diff < 0
    ? ('早点 ' + fmtTime(-diff))
    : ('晚点 ' + fmtTime(diff));

  pc.className = Math.abs(diff) <= 20 ? 'v good'
               : Math.abs(diff) <= 60 ? 'v warn'
               :                       'v bad';

  /* 评分 */
  const scoreEl = document.getElementById('scoreTxt');

  scoreEl.textContent = Math.max(0, Math.round(G.score));
  scoreEl.className   = 'v ' + (
    G.score >= 85 ? 'good' :
    G.score >= 60 ? 'warn' :
                    'bad'
  );

  /* 行程 */
  const pct = Math.min(100, G.dist / R.total * 100);

  document.getElementById('progTxt').textContent = pct.toFixed(0) + '%';
  document.getElementById('prog').firstElementChild.style.width = pct + '%';

  /* 消息计时 */
  if (msgTimer > 0) {
    msgTimer -= dt;
    if (msgTimer <= 0) {
      document.getElementById('msg').className = '';
    }
  }

  updateAudio();

}


/* ---- 11.7 主循环 ---- */
function loop(now) {

  const rawDt = Math.min(0.05, (now - lastT) / 1000 || 0.016);
  lastT = now;

  const dt = rawDt * G.timeScale;

  try {
    update(dt);
    updateWorld();
    renderer.render(scene, camera);
    drawAlign();
    drawRain();
  } catch (e) {
    const m = document.getElementById('msg');
    m.textContent = '运行错误: ' + e.message;
    m.className = 'on bad';
  }

  requestAnimationFrame(loop);

}


/* ---- 11.8 窗口缩放 ---- */
function size3d() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  sizeRain();
}

size3d();
window.addEventListener('resize', size3d);
window.addEventListener('orientationchange', () => setTimeout(size3d, 200));


/* ============================================================================
 * 启动
 * ============================================================================ */
buildRoute();
buildSignals();
buildStations();

refreshMuteIcon();
refreshTimeBtn();

speedValEl.innerHTML = '0<b>km/h</b>';

requestAnimationFrame(loop);
</script>
