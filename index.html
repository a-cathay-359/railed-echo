<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高铁模拟驾驶 · 真3D版</title>
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;600;700;800&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%23e8352c'/%3E%3Cpath d='M5 12h14M9 5l1.5 7M15 5l-1.5 7' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{ --red:#e8352c; --amber:#ffb020; --green:#2fb24f; --panel:rgba(10,18,28,.6); --line:rgba(255,255,255,.14); }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow:hidden; background:#0c1520; font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:#eaf2fa;}
  #game{position:fixed; inset:0; display:block; touch-action:none;}
  #rain{position:fixed; inset:0; pointer-events:none; display:none;}
  #nightOv{position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 45%, rgba(10,15,40,.1), rgba(4,6,20,.85)); opacity:0; transition:opacity 2s;}
  #wrap{position:fixed; inset:0; pointer-events:none;}
  .pill{background:var(--panel); border:1px solid var(--line); border-radius:12px; backdrop-filter:blur(6px);}
  #hudTop{position:absolute; top:0; left:0; right:0; display:flex; align-items:flex-start; justify-content:space-between; gap:8px; padding:10px 12px;}
  #speedBox{min-width:112px; padding:9px 13px; text-align:center;}
  #speedVal{font-size:32px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums;}
  #speedVal b{font-size:14px; font-weight:600; color:#9fb2c6; margin-left:2px;}
  #speedLbl{font-size:11px; color:#9fb2c6; margin-top:2px; letter-spacing:2px;}
  #limitTag{margin-top:6px; font-size:12px; padding:3px 8px; border-radius:6px; font-weight:700; display:inline-block;}
  #limitTag.ok{background:rgba(47,178,79,.16); color:#6fe08b;}
  #limitTag.over{background:rgba(232,53,44,.2); color:#ff8d85; animation:blink .5s infinite;}
  #rightCol{display:flex; flex-direction:column; gap:8px; align-items:flex-end;}
  #rowTop{display:flex; gap:8px; align-items:center;}
  .iconBtn{pointer-events:auto; width:40px; height:40px; border-radius:11px; border:1px solid var(--line); background:var(--panel); color:#eaf2fa; cursor:pointer; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px);}
  .iconBtn:active{background:rgba(255,255,255,.18);}
  .stat{padding:7px 11px; font-size:13px; line-height:1.5;}
  .stat .k{color:#9fb2c6; font-size:11px;}
  .stat .v{font-weight:700; font-variant-numeric:tabular-nums;}
  .stat .v.good{color:#6fe08b;} .stat .v.bad{color:#ff8d85;} .stat .v.warn{color:#ffc85c;}
  #sigDot{width:11px;height:11px;border-radius:50%;display:inline-block;}
  #sigDot.g{background:#2fb24f; box-shadow:0 0 8px #2fb24f;} #sigDot.y{background:#ffb020; box-shadow:0 0 8px #ffb020;} #sigDot.r{background:#ff3b30; box-shadow:0 0 10px #ff3b30;} #sigDot.o{background:#6c7a8c;}
  #prog{margin-top:6px; height:5px; border-radius:3px; background:rgba(255,255,255,.12); overflow:hidden; width:140px;}
  #prog>i{display:block; height:100%; width:0%; background:linear-gradient(90deg,#2fb24f,#e8352c);}
  #centerTop{position:absolute; top:12px; left:50%; transform:translateX(-50%); text-align:center; pointer-events:none;}
  #msg{display:none; font-size:14px; font-weight:700; padding:8px 16px; border-radius:10px;}
  #msg.on{display:inline-block;}
  #msg.good{background:rgba(16,90,50,.88); color:#a7f3c4;}
  #msg.warn{background:rgba(120,70,0,.88); color:#ffe0a3;}
  #msg.bad{background:rgba(130,18,18,.92); color:#ffc4c0;}
  .lever{position:absolute; top:150px; width:50px; pointer-events:auto; touch-action:none; user-select:none; -webkit-user-select:none;}
  #throttleLever{right:6px;} #brakeLever{left:6px;}
  .lever .cap{font-size:10px; color:#9fb2c6; text-align:center; margin-bottom:4px; letter-spacing:1px;}
  .lever .track{position:relative; height:230px; background:rgba(8,14,22,.55); border:1px solid var(--line); border-radius:12px; backdrop-filter:blur(4px);}
  .lever .tick{position:absolute; left:8px; right:8px; height:1px; background:rgba(255,255,255,.18);}
  .lever .ticklbl{position:absolute; font-size:9px; color:#b6c2d0; width:38px; line-height:1; text-align:center;}
  .lever .handle{position:absolute; left:4px; right:4px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; box-shadow:0 2px 8px rgba(0,0,0,.4); transition:bottom .08s;}
  #throttleLever .handle{background:linear-gradient(180deg,#37c264,#1f8f42); color:#eafff0;}
  #brakeLever .handle{background:linear-gradient(180deg,#f0a020,#c96a10); color:#fff;}
  #brakeLever .handle.emer{background:linear-gradient(180deg,#ff5040,#b81f14);}
  #hudBot{position:absolute; bottom:0; left:0; right:0; padding:8px 12px; display:flex; justify-content:center; align-items:flex-end; gap:10px;}
  #midInfo{padding:7px 12px; font-size:12px; line-height:1.5;}
  #midInfo .big{font-size:19px; font-weight:800;}
  .hornBtn{pointer-events:auto; width:60px; height:60px; border-radius:50%; border:1px solid rgba(232,53,44,.6); background:rgba(232,53,44,.28); color:#fff; font-size:14px; font-weight:700; cursor:pointer;}
  .hornBtn:active{transform:scale(.95);}
  .overlay{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; z-index:30; background:radial-gradient(120% 120% at 50% 0%,rgba(16,28,42,.92),rgba(5,9,16,.98)); overflow:auto;}
  .overlay.hide{display:none;}
  .card{max-width:440px; width:100%; background:rgba(12,20,32,.92); border:1px solid var(--line); border-radius:18px; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .title{font-size:24px; font-weight:800; display:flex; align-items:center; gap:10px;}
  .title .tag{font-size:11px; font-weight:600; background:var(--red); color:#fff; padding:3px 8px; border-radius:6px;}
  .sub{color:#9fb2c6; font-size:13px; margin-top:6px;}
  .routeList{margin:14px 0; display:flex; flex-direction:column; gap:8px;}
  .routeCard{border:1px solid var(--line); border-radius:12px; padding:11px 13px; cursor:pointer; background:rgba(255,255,255,.04);}
  .routeCard.sel{border-color:var(--green); background:rgba(47,178,79,.12);}
  .routeCard .rn{font-weight:800; font-size:15px;}
  .routeCard .rd{font-size:11px; color:#9fb2c6; margin-top:3px; line-height:1.5;}
  .routeCard .rk{display:inline-block; font-size:10px; background:rgba(255,255,255,.1); border-radius:5px; padding:1px 6px; margin-right:4px; margin-top:5px;}
  .keys{display:grid; grid-template-columns:1fr 1fr; gap:7px; font-size:12px; margin:12px 0;}
  .keys .k{display:flex; align-items:center; gap:7px; color:#cfdaea;}
  .key{display:inline-block; min-width:24px; text-align:center; background:rgba(255,255,255,.1); border:1px solid var(--line); border-radius:6px; padding:2px 5px; font-weight:700; font-size:11px;}
  .go{width:100%; margin-top:6px; padding:13px; font-size:17px; font-weight:800; background:var(--red); color:#fff; border:none; border-radius:12px; cursor:pointer; letter-spacing:4px;}
  .go:active{transform:translateY(1px); background:#c92c24;}
  .result-line{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px dashed rgba(255,255,255,.1); font-size:14px;}
  .result-line:last-child{border:none;}
  .result-line .l{color:#9fb2c6;}
  .result-line .r{font-weight:800; font-variant-numeric:tabular-nums;}
  #gradeBig{text-align:center; font-size:60px; font-weight:900; line-height:1; margin:6px 0 2px;}
  #gradeSub{text-align:center; color:#9fb2c6; font-size:13px; margin-bottom:12px;}
  #crashReason{text-align:center; color:#ff8d85; font-size:14px; font-weight:700; margin-bottom:10px;}
  @keyframes blink{50%{opacity:.45;}}
  .hint{font-size:11px; color:#6c7a8c; text-align:center; margin-top:12px; line-height:1.6;}
  @media (max-width:600px){ #speedVal{font-size:26px;} .stat{font-size:12px; padding:6px 9px;} #prog{width:100px;} #keyHint{display:none;} .title{font-size:21px;} .lever{top:130px; width:44px;} .lever .track{height:200px;} }
  @media (min-width:601px){ #keyHint{display:block;} }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="rain"></canvas>
<div id="nightOv"></div>
<div id="wrap">
  <div id="hudTop">
    <div id="speedBox" class="pill">
      <div id="speedVal">0<b>km/h</b></div>
      <div id="speedLbl">当前速度</div>
      <span id="limitTag" class="ok">限速 350</span>
    </div>
    <div id="rightCol">
      <div id="rowTop">
        <div class="pill stat"><span class="k">行程 </span><span id="progTxt" class="v">0%</span><div id="prog"><i></i></div></div>
        <button class="iconBtn" id="timeBtn" title="时间倍速" onclick="void 0" style="font-size:13px;font-weight:800;width:48px;">1x</button>
        <button class="iconBtn" id="muteBtn" title="声音开关" onclick="void 0"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><line id="muteline1" x1="22" y1="9" x2="16" y2="15"/><line id="muteline2" x1="16" y1="9" x2="22" y2="15"/></svg></button>
      </div>
      <div class="pill stat"><span class="k">时刻 </span><span id="timeTxt" class="v">00:00</span></div>
      <div class="pill stat"><span class="k">准点 </span><span id="puncTxt" class="v good">±0s</span></div>
    </div>
  </div>
  <div id="centerTop"><div id="msg"></div></div>
  <div class="lever" id="brakeLever"><div class="cap">制动</div><div class="track" id="brakeTrack"></div></div>
  <div class="lever" id="throttleLever"><div class="cap">牵引</div><div class="track" id="throttleTrack"></div></div>
  <div id="hudBot">
    <div id="midInfo" class="pill">
      <div><span class="k">下一信号 </span><span id="sigDot" class="o"></span> <span id="sigTxt">--</span></div>
      <div><span class="k">牵引 </span><span id="thrVal">0</span> 档 · <span class="k">制动 </span><span id="brkVal">缓解</span></div>
      <div><span class="k">停车点 </span><span id="stopDist" class="big">--</span></div>
      <div><span class="k">评分 </span><span id="scoreTxt" class="v warn">100</span></div>
    </div>
    <button class="hornBtn" id="btnHorn">鸣笛</button>
  </div>
</div>

<div class="overlay" id="startOv">
  <div class="card">
    <div class="title">高铁模拟驾驶<span class="tag">真3D</span></div>
    <div class="sub">选择线路，用操纵杆在 3D 线路上完成乘务</div>
    <div class="routeList" id="routeList"></div>
    <div class="keys" id="keyHint">
      <div class="k"><span class="key">W/↑</span> 牵引加档</div>
      <div class="k"><span class="key">S/↓</span> 牵引减档</div>
      <div class="k"><span class="key">A</span> 制动减档 · <span class="key">D</span> 加档</div>
      <div class="k"><span class="key">空格</span> 鸣笛 · <span class="key">P</span> 暂停</div>
      <div class="k"><span class="key">C</span> 切换视角</div>
      <div class="k"><span class="key">M</span> 静音</div>
    </div>
    <button class="go" id="startBtn">发 车</button>
    <div class="hint">把列车精准停在红色停车牌内 = 高分；红灯前须制动停车<br>默认静音，点右上角喇叭开声</div>
  </div>
</div>

<div class="overlay hide" id="endOv">
  <div class="card">
    <div class="title" id="endTitle">任务完成</div>
    <div id="crashReason" style="display:none"></div>
    <div id="gradeBig">S</div>
    <div id="gradeSub">全速准点 · 车长典范</div>
    <div id="endBody"></div>
    <button class="go" id="againBtn">再跑一趟</button>
  </div>
</div>

<script src="https://unpkg.com/three@0.150.0/build/three.min.js"></script>
<script>
"use strict";
/* =====================================================================
   复兴号高铁模拟驾驶 · v2 增强版
   - 多站点停靠（每站精准停车独立计分）
   - ATP 超速自动防护（超速自动施加制动 + 扣分）
   - 雨天湿滑（牵引力/制动力双降）+ 昼夜光照循环
   - 三种镜头：驾驶室 / 高空跟随 / 侧后回望（按 C 切换）
   ===================================================================== */

/* ---------------- 线路数据 ---------------- */
const ROUTES = {
  jinghu:{
    name:'京沪高铁', sub:'北京南 → 上海虹桥', vmax:350, target:330, urban:0.2,
    sky:0x9fc3e0, fog:0xcfe0ee, ground:0x6f8a4a, total:21100,
    zones:[{d:18600,end:20000,limit:160}],
    signals:[{d:11000,kind:'slow',name:'L4 慢行信号',limit:180}],
    stations:[
      {name:'天津南', d:9600,  half:150},
      {name:'济南西', d:16000, half:150},
      {name:'上海虹桥', d:20500, half:320, final:true}
    ],
    tunnel:{d:12300,end:15800}, bridge:{d:15800,end:16500},
    meets:[{d:8000}]
  },
  chengyu:{
    name:'成渝高铁', sub:'成都东 → 重庆北', vmax:300, target:285, urban:0.1,
    sky:0x8bb6cf, fog:0xd6e4dc, ground:0x4f703c, total:15800,
    zones:[{d:13000,end:14800,limit:120}],
    signals:[{d:8000,kind:'slow',name:'C4 慢行信号',limit:150}],
    stations:[
      {name:'资阳北', d:6600,  half:140},
      {name:'内江北', d:11000, half:140},
      {name:'重庆北', d:15200, half:300, final:true}
    ],
    tunnel:{d:5000,end:11000}, bridge:{d:11500,end:12200},
    meets:[{d:9000}]
  },
  guangshen:{
    name:'广深城际', sub:'广州东 → 深圳北', vmax:200, target:280, urban:0.85,
    sky:0xa8c8e2, fog:0xe4eef2, ground:0x8a9a7c, total:11200,
    zones:[{d:8600,end:9600,limit:120}],
    signals:[{d:6000,kind:'slow',name:'G4 慢行信号',limit:120}],
    stations:[
      {name:'东莞站', d:5200,  half:130},
      {name:'深圳北', d:10600, half:280, final:true}
    ],
    tunnel:null, bridge:{d:3000,end:3500},
    meets:[{d:4500}]
  }
};

let routeKey = 'jinghu';
let R = ROUTES[routeKey];
let zones = [], signals = [];

function buildRoute(){
  zones = R.zones.map(z => ({d:z.d, end:z.end, limit:z.limit}));
  signals = [];
  for(const s of R.signals){
    signals.push({
      d:s.d, kind:'slow', name:s.name,
      limit: s.limit || Math.round(R.vmax*0.6),
      passed:false, state:'red', praised:false
    });
  }
  R.stations.forEach((st,i)=>{
    st.served = false;
    st.err = null;
    if(!st.final){
      signals.push({
        d: Math.max(500, st.d - 1400),
        kind:'station', name: st.name + ' 预告信号',
        limit: R.vmax, passed:false, state:'yellow', praised:false
      });
    }
  });
  signals.sort((a,b)=>a.d-b.d);
}
function currentLimit(){
  let lim = R.vmax;
  for(const z of zones){ if(G.dist >= z.d && G.dist < z.end) lim = Math.min(lim, z.limit); }
  return lim;
}
function hash(n){ const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); }

/* ---------------- 全局状态 ---------------- */
const G = {
  running:false, ended:false, paused:false,
  dist:0, v:0, time:0, score:100,
  throttleNotch:0, brakeNotch:0,
  overspeedSec:0, atpSec:0, atpActive:false,
  arrived:false, crashReason:'', stopBonus:0, stopErr:null,
  stationIdx:0, metSet:{},
  timeScale:1, rainy:false, night:0, camMode:0, announced:false,
  riverD:0, extraMeets:[], newBest:false
};
const THROT_CURVE = [0, 0.45, 0.95, 1.45, 1.95, 2.45];
const BRAKE_CURVE = [0, 0.90, 1.80, 2.90, 4.20, 7.50];
const DRAG = 0.000012;
let lastT = 0, harshCooldown = 0, msgTimer = 0;

/* ---------------- 音频 ---------------- */
let actx = null, engO1 = null, engO2 = null, engGain = null, engFlt = null, muted = true;
function initAudio(){
  if(actx) return;
  try{
    actx = new (window.AudioContext || window.webkitAudioContext)();
    engGain = actx.createGain(); engGain.gain.value = 0;
    engFlt = actx.createBiquadFilter(); engFlt.type = 'lowpass'; engFlt.frequency.value = 600;
    engO1 = actx.createOscillator(); engO1.type = 'sawtooth'; engO1.frequency.value = 30;
    engO2 = actx.createOscillator(); engO2.type = 'sawtooth'; engO2.frequency.value = 45;
    const g2 = actx.createGain(); g2.gain.value = 0.5;
    engO2.connect(g2); engO1.connect(engFlt); g2.connect(engFlt);
    engFlt.connect(engGain); engGain.connect(actx.destination);
    engO1.start(); engO2.start();
  }catch(e){ actx = null; }
}
function updateAudio(){
  if(!actx || muted || !G.running || G.paused){
    if(engGain && actx) engGain.gain.setTargetAtTime(0, actx.currentTime, 0.1);
    return;
  }
  const kmh = G.v*3.6;
  engO1.frequency.setTargetAtTime(28 + kmh*0.75, actx.currentTime, 0.08);
  engO2.frequency.setTargetAtTime(42 + kmh*1.10, actx.currentTime, 0.08);
  engGain.gain.setTargetAtTime(Math.min(0.22, 0.04 + kmh*0.0005), actx.currentTime, 0.1);
}
function brakeSqueal(){
  if(!actx || muted) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(); o.type = 'square';
  o.frequency.value = 1800 + Math.random()*600;
  const g = actx.createGain(); g.gain.value = 0;
  g.gain.linearRampToValueAtTime(0.09, t+0.03);
  g.gain.setTargetAtTime(0, t+0.1, 0.12);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t+0.5);
}
function horn(){
  if(!actx || muted) return;
  const t = actx.currentTime;
  [523, 659].forEach(f=>{
    const o = actx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const gn = actx.createGain(); gn.gain.setValueAtTime(0, t);
    gn.gain.linearRampToValueAtTime(0.26, t+0.02);
    gn.gain.linearRampToValueAtTime(0.26, t+0.6);
    gn.gain.linearRampToValueAtTime(0, t+0.95);
    o.connect(gn); gn.connect(actx.destination);
    o.start(t); o.stop(t+1.0);
  });
}
function refreshMuteIcon(){
  document.getElementById('muteline1').style.display = muted ? '' : 'none';
  document.getElementById('muteline2').style.display = muted ? '' : 'none';
  document.getElementById('muteBtn').style.opacity = muted ? 0.5 : 1;
}
document.getElementById('muteBtn').addEventListener('click', ()=>{
  muted = !muted; initAudio();
  if(actx && actx.state === 'suspended' && !muted) actx.resume();
  refreshMuteIcon();
});
const SCALES = [1,2,4,8];
function refreshTimeBtn(){
  const b = document.getElementById('timeBtn');
  b.textContent = G.timeScale + 'x';
  b.style.color = G.timeScale > 1 ? '#ffc85c' : '';
}
document.getElementById('timeBtn').addEventListener('click', ()=>{
  const i = SCALES.indexOf(G.timeScale);
  G.timeScale = SCALES[(i+1) % SCALES.length];
  refreshTimeBtn();
});

/* ---------------- three.js 场景 ---------------- */
function trackX(d){ return Math.sin(d*0.0003)*26 + Math.sin(d*0.00011)*18 + Math.sin(d*0.000045)*12; }
function trackDx(d){
  return 26*0.0003*Math.cos(d*0.0003)
       + 18*0.00011*Math.cos(d*0.00011)
       + 12*0.000045*Math.cos(d*0.000045);
}
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 900);
const ambient = new THREE.AmbientLight(0xffffff, 0.85); scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff5e0, 0.7); sun.position.set(30,60,40); scene.add(sun);

const sceneFog = new THREE.Fog(0xcfe0ee, 40, 600); scene.fog = sceneFog;
const _sky = new THREE.Color(0x9fc3e0);

const rainCv = document.getElementById('rain');
const rctx = rainCv.getContext('2d');
const drops = [];
function sizeRain(){ rainCv.width = innerWidth; rainCv.height = innerHeight; }
sizeRain(); addEventListener('resize', sizeRain);
for(let i=0;i<170;i++){
  drops.push({x:Math.random()*innerWidth, y:Math.random()*innerHeight,
    l:8 + Math.random()*14, v:9 + Math.random()*9});
}
function drawRain(){
  if(!G.rainy){ rctx.clearRect(0,0,rainCv.width,rainCv.height); return; }
  rctx.clearRect(0,0,rainCv.width,rainCv.height);
  rctx.strokeStyle = 'rgba(174,200,230,.45)'; rctx.lineWidth = 1; rctx.beginPath();
  for(const d of drops){
    rctx.moveTo(d.x, d.y); rctx.lineTo(d.x-2, d.y+d.l);
    d.y += d.v; d.x -= 1.2;
    if(d.y > innerHeight){ d.y = -20; d.x = Math.random()*innerWidth; }
  }
  rctx.stroke();
}

function size3d(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
size3d(); window.addEventListener('resize', size3d);

/* ---------------- 3D 世界更新 ---------------- */
function updateWorld(){
  const d = G.dist, camZ = -d;

  const night = Math.max(0, Math.min(1, (G.time - 150)/90));
  G.night = night;
  document.getElementById('nightOv').style.opacity = (night*0.5).toFixed(3);
  ambient.intensity = 0.85 - night*0.55;
  sun.intensity = 0.7 * (1 - night*0.8);
  sun.color.setHSL(0.1, 0.35, 0.55 + 0.35*(1-night));

  _sky.setHex(R.sky).lerp(new THREE.Color(0x0a1220), night);
  _fog.setHex(R.fog).lerp(new THREE.Color(0x121a2a), night);

  const inTunnel = !!(R.tunnel && d >= R.tunnel.d && d < R.tunnel.end);
  if(inTunnel){
    scene.background = _tunnelCol;
    sceneFog.color.setHex(0x0a0d10); sceneFog.near = 5; sceneFog.far = 80;
  }else{
    scene.background = _sky;
    sceneFog.color.copy(_fog); sceneFog.near = 40; sceneFog.far = 600;
  }

  if(G.camMode === 0){
    camera.position.set(trackX(d), 1.7, camZ);
    camera.lookAt(trackX(d+40), 1.5, -(d+40));
  }else if(G.camMode === 1){
    camera.position.set(trackX(d)+2.5, 8.5, camZ+12);
    camera.lookAt(trackX(d+30), 1.2, -(d+30));
  }else{
    camera.position.set(trackX(d)+5, 2.8, camZ+7);
    camera.lookAt(trackX(d-60), 1.6, -(d-60));
  }

  const midD = d + trackLen/2;
  const yaw = -Math.atan(trackDx(midD));
  ballast.position.set(trackX(midD), 0, camZ - trackLen/2);       ballast.rotation.y = yaw;
  railL.position.set(trackX(midD)-0.75, 0.22, camZ - trackLen/2); railL.rotation.y = yaw;
  railR.position.set(trackX(midD)+0.75, 0.22, camZ - trackLen/2); railR.rotation.y = yaw;

  ground.position.set(trackX(d), -0.2, camZ - 600);
  ground.material.color.setHex(R.ground);

  for(const m of sleepers){
    if(m.userData.wz - camZ > 15) m.userData.wz -= SN*sSp;
    const sd = -m.userData.wz;
    m.position.set(trackX(sd), 0.18, m.userData.wz);
    m.rotation.y = Math.atan(trackDx(sd));
  }
  for(const p of poles){
    if(p.userData.wz - camZ > 15) p.userData.wz -= 30*70;
    p.position.set(trackX(-p.userData.wz) + p.userData.side*3.2, 4.5, p.userData.wz);
  }
  for(const t of trees){
    if(t.userData.wz - camZ > 15) t.userData.wz -= TN*tSp;
    t.position.set(trackX(-t.userData.wz) + t.userData.side*t.userData.xoff,
                   1.5*t.userData.s, t.userData.wz);
  }
  for(const b of blds){
    if(b.userData.wz - camZ > 15) b.userData.wz -= BN*bSp;
    b.visible = b.userData.show;
    if(b.visible){
      b.position.set(trackX(-b.userData.wz) + b.userData.side*b.userData.xoff,
                     3*b.userData.s, b.userData.wz);
      b.scale.setScalar(b.userData.s);
    }
  }

  for(const g of sigGroup.children){
    const s = g.userData.sig, wz = -s.d;
    g.visible = !s.passed && (wz - camZ) < -2 && (wz - camZ) > -620;
    g.position.set(trackX(s.d) + 2.2, 0, wz);
    const col = s.state === 'green' ? 0x2fb24f : (s.state === 'yellow' ? 0xffb020 : 0xff3b30);
    g.userData.lamp.material.color.setHex(col);
  }

  const ns = R.stations[G.stationIdx];
  if(ns){
    const near = d > ns.d - 500 && d < ns.d + 250;
    stopGroup.visible = near;
    if(near){
      stopGroup.position.set(trackX(ns.d) - 1.4, 0, -ns.d);
      stopGroup.rotation.y = Math.atan(trackDx(ns.d));
      stopBoard.material.color.setHex(ns.final ? 0xff3b30 : 0xffb020);
    }
  }else{
    stopGroup.visible = false;
  }

  let seen = false;
  for(const mt of R.meets.concat(G.extraMeets)){
    const rel = mt.d - G.dist;
    if(rel > -120 && rel < 700){
      oTrain.position.set(trackX(mt.d) + 2.4, 0, -mt.d);
      oTrain.rotation.y = Math.atan(trackDx(mt.d)) + Math.PI;
      oTrain.visible = true; seen = true;
    }
  }
  if(!seen) oTrain.visible = false;

  for(const c of clouds){
    if(c.userData.wz - camZ > 20) c.userData.wz -= 10*120;
    c.position.z = c.userData.wz;
  }

  if(G.riverD){
    const near = Math.abs(G.dist - G.riverD) < 250;
    river.visible = near;
    if(near){
      river.position.set(trackX(G.riverD), -0.15, -G.riverD);
      river.rotation.z = Math.atan(trackDx(G.riverD));
    }
  }

  tunnelMesh.visible = inTunnel;
  if(inTunnel) tunnelMesh.position.set(trackX(d), 5, camZ - 20);
}

/* ---------------- 操纵杆 ---------------- */
const THR_LABEL = ['切','1','2','3','4','5'];
const BRK_LABEL = ['缓解','1','2','3','4','紧急'];
function buildLever(trackId, labels, onChange, emerIdx){
  const track = document.getElementById(trackId);
  track.innerHTML = '';
  const n = labels.length;
  for(let i=0;i<n;i++){
    const frac = i/(n-1);
    const tick = document.createElement('div');
    tick.className = 'tick'; tick.style.bottom = (frac*100)+'%';
    const lbl = document.createElement('div');
    lbl.className = 'ticklbl';
    lbl.style.bottom = 'calc(' + (frac*100) + '% - 5px)';
    if(trackId === 'throttleTrack') lbl.style.right = '46px';
    else lbl.style.left = '46px';
    lbl.textContent = labels[i];
    track.appendChild(tick); track.appendChild(lbl);
  }
  const handle = document.createElement('div');
  handle.className = 'handle'; track.appendChild(handle);

  function upd(){
    const idx = (trackId === 'throttleTrack') ? G.throttleNotch : G.brakeNotch;
    handle.style.bottom = 'calc(' + (idx/(n-1)*100) + '% - 16px)';
    handle.textContent = labels[idx];
    if(emerIdx != null) handle.classList.toggle('emer', idx === emerIdx);
  }
  let drag = false;
  track.addEventListener('pointerdown', e=>{
    e.preventDefault(); drag = true;
    try{ track.setPointerCapture(e.pointerId); }catch(_){}
    set(e.clientY);
  });
  track.addEventListener('pointermove', e=>{ if(drag) set(e.clientY); });
  const end = ()=>{ drag = false; };
  track.addEventListener('pointerup', end);
  track.addEventListener('pointercancel', end);
  track.addEventListener('lostpointercapture', end);
  function set(cy){
    const r = track.getBoundingClientRect();
    let f = 1 - (cy - r.top)/r.height;
    f = Math.max(0, Math.min(1, f));
    onChange(Math.round(f*(n-1)));
    upd();
  }
  return upd;
}
let refreshThr, refreshBrk;
refreshThr = buildLever('throttleTrack', THR_LABEL, i=>{
  G.throttleNotch = i;
  if(i > 0 && G.brakeNotch > 0){ G.brakeNotch = 0; refreshBrk(); }
}, null);
refreshBrk = buildLever('brakeTrack', BRK_LABEL, i=>{
  G.brakeNotch = i;
  if(i > 0 && G.throttleNotch > 0){ G.throttleNotch = 0; refreshThr(); }
}, 5);

/* ---------------- 键盘 ---------------- */
document.addEventListener('keydown', e=>{
  if(e.repeat) return;
  if(e.code === 'Space' || e.code === 'KeyH'){ e.preventDefault(); horn(); }
  if(e.code === 'KeyP'){ e.preventDefault(); togglePause(); }
  if(e.code === 'KeyM') document.getElementById('muteBtn').click();
  if(e.code === 'KeyC'){ G.camMode = (G.camMode + 1) % 3; showMsg(['驾驶室视角','高空跟随','侧后回望'][G.camMode], 'warn'); }
  if(e.code === 'KeyR' && G.ended) startRun();
  if(G.running && !G.paused){
    if(e.code === 'KeyW' || e.code === 'ArrowUp'){
      G.throttleNotch = Math.min(5, G.throttleNotch+1);
      if(G.throttleNotch > 0 && G.brakeNotch > 0) G.brakeNotch = 0;
      refreshThr(); refreshBrk();
    }
    if(e.code === 'KeyS' || e.code === 'ArrowDown'){
      G.throttleNotch = Math.max(0, G.throttleNotch-1); refreshThr();
    }
    if(e.code === 'KeyD' || e.code === 'ArrowRight'){
      G.brakeNotch = Math.min(5, G.brakeNotch+1);
      if(G.brakeNotch > 0 && G.throttleNotch > 0) G.throttleNotch = 0;
      refreshThr(); refreshBrk();
    }
    if(e.code === 'KeyA' || e.code === 'ArrowLeft'){
      G.brakeNotch = Math.max(0, G.brakeNotch-1); refreshBrk();
    }
  }
});

/* ---------------- 开始 / 结束 ---------------- */
function startRun(){
  initAudio();
  if(actx && actx.state === 'suspended' && !muted) actx.resume();

  R = ROUTES[routeKey];
  buildRoute();
  buildSignals();

  G.running = true; G.ended = false; G.paused = false;
  G.dist = 0; G.v = 0; G.time = 0; G.score = 100;
  G.throttleNotch = 0; G.brakeNotch = 0;
  G.overspeedSec = 0; G.atpSec = 0; G.atpActive = false;
  G.arrived = false; G.crashReason = ''; G.stopBonus = 0; G.stopErr = null;
  G.stationIdx = 0; G.metSet = {};
  G.announced = false; G.newBest = false; G.camMode = 0;

  G.riverD = 3000 + Math.random()*(R.total - 6000);
  G.extraMeets = [];
  const extra = Math.floor(Math.random()*3);
  for(let i=0;i<extra;i++) G.extraMeets.push({d: 1500 + Math.random()*(R.total - 3000)});

  G.rainy = Math.random() < 0.35;
  document.getElementById('rain').style.display = G.rainy ? 'block' : 'none';

  harshCooldown = 0; msgTimer = 0;
  lastT = performance.now();

  document.getElementById('startOv').classList.add('hide');
  document.getElementById('endOv').classList.add('hide');
  refreshThr(); refreshBrk();

  showMsg(G.rainy ? '今日有雨 · 制动距离延长' : ('发车 · ' + R.sub), G.rainy ? 'warn' : 'good');
}

function finishRun(ok, reason){
  G.running = false; G.ended = true;
  if(!ok){
    G.score = 0; G.crashReason = reason || '任务失败';
  }else{
    G.arrived = true;
    const diff = G.time - R.target;
    const bonus = Math.abs(diff) <= 20 ? 15 : (Math.abs(diff) <= 60 ? 5 : -10);
    G.score = Math.max(0, Math.round(G.score + bonus));
    const prev = getBest();
    G.newBest = G.score > (prev ? prev.score : 0);
    if(G.newBest) setBest({score:G.score, grade:scoreGrade(G.score).g, t:Math.round(G.time)});
  }
  showEnd();
}

function showEnd(){
  const lastSt = R.stations[R.stations.length-1];
  document.getElementById('endTitle').textContent =
    G.arrived ? ('到达 ' + lastSt.name) : '行车事故';
  const c = document.getElementById('crashReason');
  c.style.display = G.arrived ? 'none' : 'block';
  if(!G.arrived) c.textContent = G.crashReason;

  const g = scoreGrade(G.score);
  const gb = document.getElementById('gradeBig');
  gb.textContent = g.g; gb.style.color = g.c;
  document.getElementById('gradeSub').textContent = g.d;

  const diff = G.time - R.target;
  const punc = G.arrived
    ? (diff <= 0 ? ('早点 ' + fmtTime(-diff)) : ('晚点 ' + fmtTime(diff)))
    : '—';
  const avg = G.arrived ? (G.dist/1000)/(G.time/3600) : 0;

  let b = '';
  b += row('线路', R.name);
  b += row('用时', fmtTime(G.time));
  b += row('行程', (G.dist/1000).toFixed(2) + ' km');
  b += row('平均速度', G.arrived ? avg.toFixed(0) + ' km/h' : '—');
  b += row('准点', punc);

  for(const st of R.stations){
    const v = st.err != null
      ? ('误差 ' + st.err.toFixed(1) + ' m')
      : (st.served ? '—' : '未停车');
    b += row('· ' + st.name, v);
  }

  b += row('停靠加分', '+' + G.stopBonus);
  b += row('超速时长', G.overspeedSec.toFixed(1) + ' s');
  b += row('ATP 干预', G.atpSec.toFixed(1) + ' s');
  b += row('最终评分', G.score + ' 分' + (G.newBest ? ' · 新纪录！' : ''));
  document.getElementById('endBody').innerHTML = b;
  document.getElementById('endOv').classList.remove('hide');
}
function row(l, r){
  return '<div class="result-line"><span class="l">' + l + '</span><span class="r">' + r + '</span></div>';
}
function scoreGrade(s){
  if(s >= 95) return {g:'S', d:'全速准点 · 车长典范', c:'#ffc85c'};
  if(s >= 82) return {g:'A', d:'运行平稳 · 表现优秀',   c:'#6fe08b'};
  if(s >= 68) return {g:'B', d:'基本达标 · 尚有提升',   c:'#7fd0ff'};
  if(s >= 50) return {g:'C', d:'勉强合格 · 注意纪律',   c:'#ffc85c'};
  return {g:'D', d:'需要回炉 · 安全第一', c:'#ff8d85'};
}
function fmtTime(s){
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s/60), ss = s%60;
  return (m<10?'0':'') + m + ':' + (ss<10?'0':'') + ss;
}
function bestKey(){ return 'hsr_best_' + routeKey; }
function getBest(){
  try{ const v = localStorage.getItem(bestKey()); return v ? JSON.parse(v) : null; }
  catch(e){ return null; }
}
function setBest(rec){
  try{ localStorage.setItem(bestKey(), JSON.stringify(rec)); }catch(e){}
}
function showMsg(t, type){
  const m = document.getElementById('msg');
  m.textContent = t; m.className = 'on ' + type; msgTimer = 3.0;
}

/* ---------------- 主逻辑 ---------------- */
const speedValEl = document.getElementById('speedVal');
const sigTxtEl   = document.getElementById('sigTxt');
const sigDotEl   = document.getElementById('sigDot');
const stopDistEl = document.getElementById('stopDist');

function update(dt){
  if(!G.running || G.paused){ updateAudio(); return; }

  const kmh = G.v*3.6;
  const lim = currentLimit();
  const vmaxMs = R.vmax/3.6;
  const ratio = Math.min(1, G.v/vmaxMs);
  const grip = G.rainy ? 0.82 : 1.0;

  const aMotor = THROT_CURVE[G.throttleNotch] * Math.max(0.08, 1 - 0.88*ratio*ratio) * grip;
  const aDrag  = DRAG*G.v*G.v + 0.03;
  const aBrake = BRAKE_CURVE[G.brakeNotch] * grip;

  const over = kmh - lim;
  if(over > 8) G.atpActive = true;
  if(over < 2) G.atpActive = false;
  const aAtp = G.atpActive ? 2.2 : 0;
  if(G.atpActive){ G.atpSec += dt; G.score -= dt*0.8; }

  const vPrev = G.v;
  G.v = Math.max(0, G.v + (aMotor - aDrag - aBrake - aAtp)*dt);
  G.dist += G.v*dt;
  G.time += dt;

  if(kmh > lim + 3){ G.overspeedSec += dt; G.score -= dt*1.0; }

  const dec = (vPrev - G.v)/dt;
  harshCooldown -= dt;
  if(G.brakeNotch > 0 && dec > 3.6 && vPrev > 8 && harshCooldown <= 0){
    G.score -= 2; harshCooldown = 1.5;
    showMsg('急刹车 -2', 'warn'); brakeSqueal();
  }

  let nextSig = null;
  for(const s of signals){
    if(!nextSig && !s.passed) nextSig = s;
    const ahead = s.d - G.dist;

    if(s.kind === 'slow' && !s.passed){
      if(ahead < 500 && ahead > -20){
        if(kmh <= s.limit){
          if(s.state !== 'green'){
            s.state = 'green';
            if(!s.praised){
              s.praised = true; G.score += 6;
              showMsg('已按规定降速 · +6', 'good');
            }
          }
        }else{
          s.state = 'red';
          G.score -= dt*1.5;
        }
      }
      if(G.dist >= s.d){
        s.passed = true;
        if(kmh > s.limit){
          G.score -= 15;
          showMsg('未按规定减速通过慢行信号 -15', 'bad');
        }
      }
    }else if(!s.passed && G.dist >= s.d){
      s.passed = true;
      if(s.kind === 'station') showMsg('已通过 ' + s.name, 'good');
    }
  }

  const st = R.stations[G.stationIdx];
  if(st){
    if(!st.served && G.v < 0.9 && Math.abs(G.dist - st.d) <= st.half){
      st.served = true;
      st.err = Math.abs(G.dist - st.d);
      const bonus = st.err < 15 ? 12 : (st.err < 40 ? 6 : 0);
      G.score += bonus;
      G.stopBonus += bonus;
      showMsg(st.name + ' 停车成功 · 误差 ' + st.err.toFixed(1) + 'm' + (bonus ? ' · +' + bonus : ''),
              'good');
      if(st.final){
        G.stopErr = st.err;
        finishRun(true);
        return;
      }
    }
    if(G.dist > st.d + st.half){
      if(!st.served){
        if(st.final){ finishRun(false, '冲过终点站，未停车'); return; }
        G.score -= 18;
        showMsg('未在 ' + st.name + ' 停车 -18', 'bad');
        st.served = true;
      }
      if(!st.final) G.stationIdx++;
    }
  }

  for(const mt of R.meets.concat(G.extraMeets)){
    if(!G.metSet[mt.d] && Math.abs(G.dist - mt.d) < 70){
      G.metSet[mt.d] = true;
      showMsg('对向列车会车通过', 'good');
    }
  }

  const finalSt = R.stations[R.stations.length-1];
  if(!G.announced && finalSt && G.dist > finalSt.d - 2500){
    G.announced = true;
    showMsg('即将到达 ' + finalSt.name + ' · 请减速停车', 'warn');
    horn();
  }

  if(G.dist >= R.total){ finishRun(false, '越过线路终点'); return; }

  const tag = document.getElementById('limitTag');
  tag.textContent = '限速 ' + lim;
  tag.className = (kmh > lim+3) ? 'over' : 'ok';

  if(speedValEl.firstChild) speedValEl.firstChild.nodeValue = String(Math.round(kmh));

  if(nextSig){
    sigTxtEl.textContent = nextSig.name + ' · ' +
      Math.round(Math.max(0, nextSig.d - G.dist)) + 'm';
    sigDotEl.className = nextSig.state === 'green' ? 'g'
                       : (nextSig.state === 'yellow' ? 'y' : 'r');
  }else{
    sigTxtEl.textContent = '区间畅通';
    sigDotEl.className = 'o';
  }

  document.getElementById('thrVal').textContent = G.throttleNotch;
  document.getElementById('brkVal').textContent = BRK_LABEL[G.brakeNotch];

  const ns = R.stations[G.stationIdx];
  if(ns){
    const rem = Math.round(ns.d - G.dist);
    stopDistEl.textContent = rem > 0 ? ('前方 ' + rem + 'm') : ('过 ' + Math.abs(rem) + 'm');
    stopDistEl.style.color = Math.abs(rem) < 60 ? '#6fe08b' : '';
  }else{
    stopDistEl.textContent = '—';
  }

  document.getElementById('timeTxt').textContent = fmtTime(G.time);

  const diff = G.time - R.target;
  const pc = document.getElementById('puncTxt');
  pc.textContent = diff < 0 ? ('早点 ' + fmtTime(-diff)) : ('晚点 ' + fmtTime(diff));
  pc.className = Math.abs(diff) <= 20 ? 'v good'
               : (Math.abs(diff) <= 60 ? 'v warn' : 'v bad');

  const scoreEl = document.getElementById('scoreTxt');
  scoreEl.textContent = Math.max(0, Math.round(G.score));
  scoreEl.className = 'v ' + (G.score >= 85 ? 'good' : (G.score >= 60 ? 'warn' : 'bad'));

  const pct = Math.min(100, G.dist/R.total*100);
  document.getElementById('progTxt').textContent = pct.toFixed(0) + '%';
  document.getElementById('prog').firstElementChild.style.width = pct + '%';

  if(msgTimer > 0){
    msgTimer -= dt;
    if(msgTimer <= 0) document.getElementById('msg').className = '';
  }

  updateAudio();
}

/* ---------------- 主循环 ---------------- */
function loop(now){
  const rawDt = Math.min(0.05, (now - lastT)/1000 || 0.016);
  lastT = now;
  const dt = rawDt * G.timeScale;
  try{
    update(dt);
    updateWorld();
    renderer.render(scene, camera);
    drawRain();
  }catch(e){
    const m = document.getElementById('msg');
    m.textContent = '运行错误: ' + e.message;
    m.className = 'on bad';
  }
  requestAnimationFrame(loop);
}

/* ---------------- 启动 ---------------- */
buildRoute();
buildSignals();
refreshMuteIcon();
refreshTimeBtn();
speedValEl.innerHTML = '0<b>km/h</b>';
requestAnimationFrame(loop);
</script>
</body>
